# Configures the cluster and the BMCs on the instances created by
# provision.yml. The workload layer is Slurm or k3s (scheduler in
# inventory/group_vars/all.yml); everything else is shared.
- name: Check the scheduler setting
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Scheduler is slurm or k3s
      ansible.builtin.assert:
        that: scheduler in ['slurm', 'k3s']
        fail_msg: "scheduler must be slurm or k3s, not {{ scheduler }}"
        quiet: true

- name: Base system
  hosts: cluster
  roles:
    - common
    - role: munge
      when: scheduler == 'slurm'

- name: Identity directory
  hosts: controller
  roles: [ldap]

- name: Identity clients and access
  hosts: cluster
  roles: [sssd, ssh]

- name: Login node
  hosts: login
  roles: [login]

- name: Emulated NVL8 GPU trays
  hosts: workers
  roles: [fakegpu]

- name: Slurm
  hosts: cluster
  roles:
    - role: slurm
      when: scheduler == 'slurm'

- name: Slurm accounting
  hosts: controller
  roles:
    - role: slurmdbd
      when: scheduler == 'slurm'

- name: Kubernetes control plane (k3s server)
  hosts: controller
  tasks:
    - name: k3s server
      ansible.builtin.include_role:
        name: k3s
      when: scheduler == 'k3s'

- name: Kubernetes GPU nodes (k3s agents)
  hosts: workers
  tasks:
    - name: k3s agent and GPUs
      ansible.builtin.include_role:
        name: k3s
        tasks_from: "{{ k3s_part }}"
      loop: [node, gpu]
      loop_control:
        loop_var: k3s_part
      when: scheduler == 'k3s'

- name: Kubernetes add-ons, queues and users
  hosts: controller
  tasks:
    - name: Cluster configuration
      ansible.builtin.include_role:
        name: k3s
        tasks_from: cluster
      when: scheduler == 'k3s'

- name: kubectl on the login node
  hosts: login
  tasks:
    - name: k3s client
      ansible.builtin.include_role:
        name: k3s
        tasks_from: client
      when: scheduler == 'k3s'

- name: Storage node (RustFS, Redis, per-user S3)
  hosts: storage
  roles: [ssh, storage, s3users]

- name: Shared filesystem (JuiceFS) and S3 clients
  hosts: cluster
  roles: [juicefs, s3client]

- name: Emulated InfiniBand fabric
  hosts: workers
  roles: [fakeib]

- name: Topology generation (topograph)
  hosts: controller
  roles: [topograph]

- name: Monitoring
  hosts: cluster
  roles: [monitoring]

- name: Dashboards
  hosts: controller
  roles: [grafana]

- name: BMCs (Redfish)
  hosts: bmc
  roles: [ssh, fakebmc]

- name: NVLink switch tray host (partition controller)
  hosts: nvswitch
  roles: [ssh, fakenmxc]
