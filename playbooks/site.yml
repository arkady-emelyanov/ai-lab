# Configures the cluster and the BMCs on the instances created by
# provision.yml. The workload layer is Slurm or k3s (scheduler in
# inventory/group_vars/all.yml); everything else is shared. Optional
# components (bmc, nvswitch, ...) are configured when they are on, and
# removed from the instances that stay when they are off.
- name: Check the settings
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Check the settings
      ansible.builtin.include_tasks: tasks/check-settings.yml

- name: Enabled instances
  ansible.builtin.import_playbook: enabled.yml

- name: Package sources
  hosts: enabled
  roles: [apt]

- name: Base system
  hosts: cluster
  roles:
    - common
    - role: munge
      when: scheduler == 'slurm'

- name: Identity directory
  hosts: controller
  roles: [ldap]

- name: Identity clients and access
  hosts: cluster
  roles: [sssd, ssh]

- name: Login node
  hosts: login
  roles: [login]

- name: Emulated GPU trays (NVL8 domain)
  hosts: workers
  roles: [fakegpu]

- name: Slurm
  hosts: cluster
  roles:
    - role: slurm
      when: scheduler == 'slurm'

- name: Slurm accounting
  hosts: controller
  tasks:
    - name: slurmdbd and MariaDB, or none (slurm_accounting)
      ansible.builtin.include_role:
        name: slurmdbd
        tasks_from: "{{ 'main' if slurm_accounting | bool else 'absent' }}"
      when: scheduler == 'slurm'

- name: Slurm REST API (slurmrestd, JWT)
  hosts: controller
  tasks:
    - name: slurmrestd
      ansible.builtin.include_role:
        name: slurmrestd
      when: scheduler == 'slurm'

- name: Container runtimes for Slurm jobs (Pyxis and enroot, Apptainer, OCI, scrun)
  hosts: login:workers
  tasks:
    - name: Container runtimes
      ansible.builtin.include_role:
        name: containers
      when: scheduler == 'slurm'

- name: Kubernetes control plane (k3s server)
  hosts: controller
  tasks:
    - name: k3s server
      ansible.builtin.include_role:
        name: k3s
      when: scheduler == 'k3s'

- name: Kubernetes GPU nodes (k3s agents)
  hosts: workers
  tasks:
    - name: k3s agent and GPUs
      ansible.builtin.include_role:
        name: k3s
        tasks_from: "{{ k3s_part }}"
      loop: [node, gpu]
      loop_control:
        loop_var: k3s_part
      when: scheduler == 'k3s'

- name: Kubernetes add-ons, queues and users
  hosts: controller
  tasks:
    - name: Cluster configuration
      ansible.builtin.include_role:
        name: k3s
        tasks_from: cluster
      when: scheduler == 'k3s'

- name: NVIDIA Run:ai (control plane and cluster)
  hosts: controller
  tasks:
    - name: Run:ai
      ansible.builtin.include_role:
        name: runai
      when: scheduler == 'k3s' and runai | bool

- name: kubectl on the login node
  hosts: login
  tasks:
    - name: k3s client
      ansible.builtin.include_role:
        name: k3s
        tasks_from: client
      when: scheduler == 'k3s'

- name: Storage node (RustFS, Redis, per-user S3)
  hosts: storage:&enabled
  roles: [ssh, storage, s3users]

- name: Shared filesystem (JuiceFS) and S3 clients
  hosts: cluster
  tasks:
    - name: JuiceFS and S3 clients, or none (storage)
      ansible.builtin.include_role:
        name: "{{ client }}"
        tasks_from: "{{ 'main' if storage | bool else 'absent' }}"
      loop: [juicefs, s3client]
      loop_control:
        loop_var: client

- name: KubeRay (operator, API server, dashboard, History Server on RustFS)
  hosts: controller
  tasks:
    - name: KubeRay, or none (kuberay)
      ansible.builtin.include_role:
        name: kuberay
        tasks_from: "{{ 'main' if kuberay | bool else 'absent' }}"
      when: scheduler == 'k3s'

- name: For clients on the host (uv, shared directories, Kubernetes service accounts)
  hosts: cluster
  roles: [clients]

- name: Emulated InfiniBand fabric
  hosts: workers
  roles: [fakeib]

- name: Topology generation (topograph)
  hosts: controller
  tasks:
    - name: topograph, or a topology from the settings (topology)
      ansible.builtin.include_role:
        name: topograph
        tasks_from: "{{ 'main' if topology | bool else 'absent' }}"

- name: Monitoring
  hosts: cluster
  tasks:
    - name: Exporters and Prometheus, or none (monitoring)
      ansible.builtin.include_role:
        name: monitoring
        tasks_from: "{{ 'main' if monitoring | bool else 'absent' }}"

- name: Dashboards
  hosts: controller
  tasks:
    - name: Grafana, or none (monitoring)
      ansible.builtin.include_role:
        name: grafana
        tasks_from: "{{ 'main' if monitoring | bool else 'absent' }}"

- name: BMCs (Redfish)
  hosts: bmc:&enabled
  roles: [ssh, fakebmc]

- name: NVLink switch tray host (partition controller)
  hosts: nvswitch:&enabled
  roles: [ssh, fakenmxc]

# A list of this lab's endpoints for this machine: addresses from the bridge,
# only the components the settings enable. Not in git (.gitignore).
- name: Lab endpoints (endpoints.md)
  hosts: controller
  gather_facts: false
  tasks:
    - name: Look up the bridge network
      ansible.builtin.command: incus network get {{ incus_bridge }} ipv4.address
      register: bridge
      delegate_to: localhost
      changed_when: false

    - name: Write endpoints.md
      ansible.builtin.template:
        src: endpoints.md.j2
        dest: "{{ repo_root }}/endpoints.md"
        mode: "0644"
      delegate_to: localhost
      vars:
        prefix: "{{ bridge.stdout.split('/')[0].rsplit('.', 1)[0] }}"
        ctrl_address: "{{ prefix }}.{{ hostvars[groups['controller'][0]].ip_host }}"
        kuberay_name: "{{ 'kuberay.' ~ ctrl_address ~ '.nip.io' if kuberay_domain == 'auto' else kuberay_domain }}"
        kuberay_history_name: "{{ 'ray-history.' ~ ctrl_address ~ '.nip.io' if kuberay_history_domain == 'auto' else kuberay_history_domain }}"
        runai_name: "{{ 'runai.' ~ ctrl_address ~ '.nip.io' if runai_domain == 'auto' else runai_domain }}"
