# End-to-end checks: jobs run through the scheduler (Slurm or k3s) as a
# directory user, frameworks see the emulated NVL8 domain, the BMCs answer,
# metrics reach Prometheus.
# make test (after make up; framework jobs need make frameworks).
- name: Slurm jobs as a cluster user
  hosts: login
  vars:
    user: "{{ cluster_users[0].name }}"
    home: "{{ shared_mount }}/home/{{ cluster_users[0].name }}"
    venv_ready: "{{ venv.stat.exists }}"
  tasks:
    - name: Slurm
      when: scheduler == 'slurm'
      block:
        # Waits out jobs still completing (e.g. from a previous run).
        - name: Both trays are up
          ansible.builtin.command: sinfo -h -N -o "%N %T"
          register: sinfo
          changed_when: false
          retries: 24
          delay: 5
          until: sinfo.stdout_lines | select('search', ' (idle|mixed|allocated)$') | list | length == groups['workers'] | length

        - name: Check for the frameworks venv
          ansible.builtin.stat:
            path: "{{ frameworks_venv }}/bin/python"
          register: venv

        - name: Copy the examples
          ansible.builtin.copy:
            src: "{{ repo_root }}/examples/"
            dest: "{{ home }}/examples/"
            owner: "{{ user }}"
            group: "{{ user }}"
            mode: preserve

        - name: Run example jobs (sbatch --wait)
          ansible.builtin.command:
            cmd: su - {{ user }} -c 'cd examples/slurm && sbatch --wait --parsable {{ item.script }}'
          loop:
            - { script: gpu-topology.sbatch, needs_venv: false }
            - { script: nvl8-hello.sbatch, needs_venv: false }
            - { script: ddp-train.sbatch, needs_venv: true }
            - { script: ray-cluster.sbatch, needs_venv: true }
          loop_control:
            label: "{{ item.script }}"
          when: not item.needs_venv or venv_ready
          register: jobs
          changed_when: true

        - name: Read job output
          ansible.builtin.slurp:
            src: "{{ home }}/examples/slurm/{{ item.item.script | replace('.sbatch', '') }}-{{ item.stdout | trim }}.out"
          loop: "{{ jobs.results | rejectattr('skipped', 'defined') | list }}"
          loop_control:
            label: "{{ item.item.script }}"
          register: outputs

        - name: Check job output
          ansible.builtin.assert:
            that: (item.content | b64decode) is search(expected[item.item.item.script])
            fail_msg: "{{ item.item.item.script }}: expected /{{ expected[item.item.item.script] }}/ in its output"
            quiet: true
          loop: "{{ outputs.results }}"
          loop_control:
            label: "{{ item.item.item.script }}"
          vars:
            expected:
              gpu-topology.sbatch: "Completed, {{ nvl_cluster_uuid }}, {{ nvl_clique_id }}"
              nvl8-hello.sbatch: "rank 7 on"
              ddp-train.sbatch: "rank 7/8 on"
              ray-cluster.sbatch: "8 tasks on"

        - name: Jobs are recorded in accounting
          ansible.builtin.command: sacct -n -X -u {{ user }} -o JobID,State -j {{ jobs.results | rejectattr('skipped', 'defined') | map(attribute='stdout') | map('trim') | join(',') }}
          register: sacct
          changed_when: false
          failed_when: sacct.stdout_lines | reject('search', 'COMPLETED') | list | length > 0

- name: Kubernetes jobs as a cluster user
  hosts: login
  vars:
    user: "{{ cluster_users[0].name }}"
    home: "{{ shared_mount }}/home/{{ cluster_users[0].name }}"
    venv_ready: "{{ venv.stat.exists }}"
    kubectl: su - {{ cluster_users[0].name }} -c
  tasks:
    - name: k3s
      when: scheduler == 'k3s'
      block:
        # GPU Feature Discovery and topograph label the trays within a minute or two.
        - name: Both trays are ready with their GPUs, clique and topology labels
          ansible.builtin.command: >-
            {{ kubectl }} 'kubectl get nodes -l nvidia.com/gpu.present=true -o jsonpath="{range .items[*]}{.metadata.name}
            {.status.conditions[?(@.type==\"Ready\")].status} {.status.allocatable.nvidia\.com/gpu}
            {.metadata.labels.nvidia\.com/gpu\.clique} {.metadata.labels.accelerator\.topograph\.run/domain}{\"\n\"}{end}"'
          register: nodes
          changed_when: false
          retries: 36
          delay: 5
          until: >-
            nodes.stdout_lines | select('search', ' True ' ~ fakegpu_count ~ ' ' ~ nvl_cluster_uuid ~ '.' ~ nvl_clique_id
            ~ ' ' ~ nvl_cluster_uuid ~ '.' ~ nvl_clique_id ~ '$') | list | length == groups['workers'] | length

        - name: Check for the frameworks venv
          ansible.builtin.stat:
            path: "{{ frameworks_venv }}/bin/python"
          register: venv

        - name: Copy the examples
          ansible.builtin.copy:
            src: "{{ repo_root }}/examples/"
            dest: "{{ home }}/examples/"
            owner: "{{ user }}"
            group: "{{ user }}"
            mode: preserve

        - name: Run example jobs (submit --wait)
          ansible.builtin.command:
            cmd: "{{ kubectl }} 'cd examples/kubernetes && ./submit --wait {{ item.manifest }}'"
          loop:
            - { manifest: gpu-topology.yaml, needs_venv: false }
            - { manifest: nvl8-hello.yaml, needs_venv: false }
            - { manifest: ddp-train.yaml, needs_venv: true }
            - { manifest: ray-cluster.yaml, needs_venv: true }
            - { manifest: ray-job.yaml, needs_venv: true, needs_kuberay: true }
          loop_control:
            label: "{{ item.manifest }}"
          when: (not item.needs_venv or venv_ready) and (not item.needs_kuberay | default(false) or kuberay | bool)
          register: jobs
          changed_when: true
          failed_when: false

        - name: Read job output
          ansible.builtin.slurp:
            src: "{{ home }}/examples/kubernetes/{{ item.stdout | trim }}.out"
          loop: "{{ jobs.results | rejectattr('skipped', 'defined') | list }}"
          loop_control:
            label: "{{ item.item.manifest }}"
          register: outputs

        - name: Check job output
          ansible.builtin.assert:
            that:
              - item.item.rc == 0
              - (item.content | b64decode) is search(expected[item.item.item.manifest])
            fail_msg: "{{ item.item.item.manifest }}: failed or no /{{ expected[item.item.item.manifest] }}/ in its output"
            quiet: true
          loop: "{{ outputs.results }}"
          loop_control:
            label: "{{ item.item.item.manifest }}"
          vars:
            expected:
              gpu-topology.yaml: "Completed, {{ nvl_cluster_uuid }}, {{ nvl_clique_id }}"
              nvl8-hello.yaml: "rank 7 on"
              ddp-train.yaml: "rank 7/8 on"
              ray-cluster.yaml: "8 tasks on"
              ray-job.yaml: "8 tasks on"

        - name: Kueue admitted the RayJob's cluster
          ansible.builtin.command: >-
            {{ kubectl }} 'kubectl get workloads -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].kind==\"RayJob\")]}{.metadata.ownerReferences[0].name}
            {.status.conditions[?(@.type==\"Admitted\")].status}{\"\n\"}{end}"'
          vars:
            rayjob: "{{ jobs.results | selectattr('item.manifest', 'equalto', 'ray-job.yaml') | rejectattr('skipped', 'defined') | map(attribute='stdout') | first | default('') | trim }}"
          register: workloads
          changed_when: false
          failed_when: workloads.stdout_lines | select('equalto', rayjob ~ ' True') | list | length != 1
          when: rayjob != ''

        - name: Every pod of nvl8-hello got its own GPU
          ansible.builtin.assert:
            that: >-
              outputs.results | selectattr('item.item.manifest', 'equalto', 'nvl8-hello.yaml') | map(attribute='content')
              | map('b64decode') | first | regex_findall('GPU-[0-9a-f-]+') | unique | length == fakegpu_count * groups['workers'] | length
            quiet: true

        # Processes in a pod run in the pod's PID namespace; their GPU memory
        # and processes must show on the tray and in the pod, also for
        # workers that are not the pod's PID 1 (torchrun's, for example).
        # No queue label: the namespace's default LocalQueue takes it.
        - name: Write a multi-process GPU pod
          ansible.builtin.copy:
            dest: /tmp/gpu-procs.yaml
            mode: "0644"
            content: |
              apiVersion: v1
              kind: Pod
              metadata: {name: gpu-procs}
              spec:
                restartPolicy: Never
                securityContext: {runAsUser: {{ cluster_users[0].uid }}, runAsGroup: {{ cluster_users[0].uid }}}
                containers:
                  - name: workers
                    image: {{ k3s_pod_image }}
                    resources:
                      limits: {nvidia.com/gpu: {{ fakegpu_count }}}
                      requests: {cpu: 100m, memory: 128Mi}
                    command: [bash, -c]
                    args:
                      - |
                        cat > /tmp/workers.py <<'EOF'
                        import ctypes, subprocess, sys, time
                        if len(sys.argv) > 1:  # worker: 1 GiB on its GPU
                            cu = ctypes.CDLL("libcuda.so.1")
                            dev, ctx, ptr = ctypes.c_int(), ctypes.c_void_p(), ctypes.c_uint64()
                            cu.cuInit(0)
                            cu.cuDeviceGet(ctypes.byref(dev), int(sys.argv[1]))
                            cu.cuDevicePrimaryCtxRetain(ctypes.byref(ctx), dev)
                            cu.cuCtxSetCurrent(ctx)
                            assert cu.cuMemAlloc_v2(ctypes.byref(ptr), ctypes.c_size_t(1 << 30)) == 0
                            print("allocated", sys.argv[1], flush=True)
                            time.sleep(600)
                        else:
                            workers = [subprocess.Popen([sys.executable, sys.argv[0], str(i)]) for i in range({{ fakegpu_count }})]
                            for w in workers:
                                w.wait()
                        EOF
                        exec python3 /tmp/workers.py

        - name: Check GPU memory and processes of a multi-process pod
          block:
            - name: Start the pod
              ansible.builtin.command: "{{ kubectl }} 'kubectl create -f /tmp/gpu-procs.yaml'"
              changed_when: true

            - name: Wait for every worker to allocate
              ansible.builtin.command: "{{ kubectl }} 'kubectl logs gpu-procs'"
              register: workers
              changed_when: false
              failed_when: false
              retries: 30
              delay: 4
              until: workers.stdout_lines | select('search', '^allocated') | list | length == fakegpu_count

            - name: Find the pod's tray
              ansible.builtin.command: "{{ kubectl }} 'kubectl get pod gpu-procs -o jsonpath={.spec.nodeName}'"
              register: tray
              changed_when: false

            - name: The tray lists every worker with its memory
              ansible.builtin.command: nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader,nounits
              delegate_to: "{{ tray.stdout | default(inventory_hostname) }}"  # templated even when skipped
              register: tray_apps
              changed_when: false
              failed_when: tray_apps.stdout_lines | select('search', ', 1024$') | list | length != fakegpu_count

            - name: The pod lists them too
              ansible.builtin.command: >-
                {{ kubectl }} 'kubectl exec gpu-procs --
                nvidia-smi --query-compute-apps=pid,used_memory --format=csv,noheader,nounits'
              register: pod_apps
              changed_when: false
              failed_when: pod_apps.stdout_lines | select('search', ', 1024$') | list | length != fakegpu_count
          always:
            - name: Delete the pod
              ansible.builtin.command: "{{ kubectl }} 'kubectl delete pod gpu-procs --now --ignore-not-found'"
              changed_when: true

        - name: A user reads cluster state but not other namespaces
          ansible.builtin.command: "{{ kubectl }} '{{ item.cmd }}'"
          loop:
            - { cmd: kubectl get nodes, allowed: true }
            - { cmd: kubectl get clusterqueues, allowed: true }
            - { cmd: kubectl -n kube-system get pods, allowed: false }
          loop_control:
            label: "{{ item.cmd }}"
          register: access
          changed_when: false
          failed_when: (access.rc == 0) != item.allowed

- name: Shared filesystem
  hosts: cluster
  tasks:
    - name: JuiceFS is mounted
      ansible.builtin.command: mountpoint -q {{ juicefs_mount }}
      changed_when: false

    - name: A file written on one node is readable on every other
      ansible.builtin.copy:
        content: "{{ ansible_facts['date_time']['epoch'] }}\n"
        dest: "{{ juicefs_mount }}/.test-roundtrip"
        mode: "0644"
      when: inventory_hostname == groups['login'][0]

    - name: Read it back everywhere
      ansible.builtin.command: cat {{ juicefs_mount }}/.test-roundtrip
      register: roundtrip
      changed_when: false
      failed_when: roundtrip.stdout | trim != hostvars[groups['login'][0]].ansible_facts['date_time']['epoch']

- name: Object storage
  hosts: storage
  tasks:
    - name: RustFS is healthy
      ansible.builtin.uri:
        url: http://localhost:{{ rustfs_port }}/health

- name: Per-user S3 from a job
  hosts: login
  vars:
    user: "{{ cluster_users[0].name }}"
    s3_script: >-
      echo test > /tmp/s3test-$$ &&
      rc cp /tmp/s3test-$$ s3/{{ cluster_users[0].name }}/test/ && rc ls s3/{{ cluster_users[0].name }}/test/ &&
      ! rc ls s3/{{ juicefs_bucket }}/ 2>/dev/null; rc rm --recursive --force s3/{{ cluster_users[0].name }}/test/ >/dev/null
  tasks:
    - name: A user can write and list their own bucket, but not others (Slurm job)
      ansible.builtin.command:
        cmd: su - {{ user }} -c 'srun -N1 bash -c "{{ s3_script }}"'
      register: s3test
      changed_when: false
      failed_when: s3test.rc != 0 or s3test.stdout is not search('s3test')
      when: scheduler == 'slurm'

    - name: The same from a pod (k3s)
      when: scheduler == 'k3s'
      block:
        - name: Write the test job
          ansible.builtin.copy:
            dest: "{{ shared_mount }}/home/{{ user }}/examples/kubernetes/s3test.yaml"
            owner: "{{ user }}"
            group: "{{ user }}"
            mode: "0644"
            content: |
              apiVersion: jobset.x-k8s.io/v1alpha2
              kind: JobSet
              metadata:
                name: "@NAME@"
                labels: {kueue.x-k8s.io/queue-name: {{ k3s_queue }}}
              spec:
                replicatedJobs:
                  - name: s3
                    template:
                      spec:
                        backoffLimit: 0
                        template:
                          spec:
                            restartPolicy: Never
                            securityContext: {runAsUser: @UID@, runAsGroup: @GID@}
                            containers:
                              - name: s3
                                image: {{ k3s_pod_image }}
                                env: [{name: HOME, value: "@HOME@"}]
                                command: [bash, -c, {{ s3_script | to_json }}]
                                resources: {requests: {cpu: 100m, memory: 64Mi}}
                                volumeMounts:
                                  - {name: shared, mountPath: /shared}
                                  - {name: rc, mountPath: /usr/local/bin/rc}
                            volumes:
                              - {name: shared, hostPath: {path: /shared, type: Directory}}
                              - {name: rc, hostPath: {path: /usr/local/bin/rc, type: File}}

        - name: A user can write and list their own bucket, but not others (pod)
          ansible.builtin.command:
            cmd: su - {{ user }} -c 'cd examples/kubernetes && name=$(./submit --wait s3test.yaml) && cat $name.out'
          register: s3test
          changed_when: false
          failed_when: s3test.rc != 0 or s3test.stdout is not search('s3test')

- name: Tray BMCs
  hosts: controller
  tasks:
    - name: Redfish reports each tray powered on with its GPUs
      ansible.builtin.uri:
        url: https://{{ item }}/redfish/v1/Systems/HGX_Baseboard_0
        user: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
        force_basic_auth: true
        validate_certs: false
      loop: "{{ groups['tray_bmc'] }}"
      register: systems
      failed_when: systems.json.PowerState != 'On' or systems.json.ProcessorSummary.Count != fakegpu_count

    - name: The NVSwitch BMC exposes both switches with all ports
      ansible.builtin.uri:
        url: https://{{ groups['nvswitch_bmc'][0] }}/redfish/v1/Fabrics/MGX_NVLinkFabric_0/Switches/NVSwitch_{{ item }}/Ports
        user: "{{ bmc_username }}"
        password: "{{ bmc_password }}"
        force_basic_auth: true
        validate_certs: false
      loop: "{{ range(nvswitch_count) | list }}"
      register: ports
      failed_when: ports.json['Members@odata.count'] != nvswitch_ports

    - name: The partition controller listens
      ansible.builtin.wait_for:
        host: "{{ groups['nvswitch'][0] }}"
        port: "{{ nmxc_port }}"
        timeout: 5

- name: Partition state reaches the trays
  hosts: workers
  tasks:
    - name: Every GPU reports the NVLink domain and a clique
      ansible.builtin.command: nvidia-smi --query-gpu=fabric.clusterUuid,fabric.cliqueId --format=csv,noheader
      register: fabric
      changed_when: false
      failed_when: fabric.stdout_lines | length != fakegpu_count or fabric.stdout_lines | reject('search', nvl_cluster_uuid) | list | length > 0

- name: Topology discovery
  hosts: controller
  tasks:
    - name: topograph sees the trays in one NVLink block (Slurm)
      ansible.builtin.command: update-topology --dry-run
      register: topo
      changed_when: false
      failed_when: topo.stdout is not search('BlockName=\\S+ Nodes=' ~ (groups['workers'] | first | regex_replace('[0-9]+$', '')) ~ '\\[')
      when: scheduler == 'slurm'

    - name: topograph labels every tray with the NVLink domain and the IB switches (k3s)
      ansible.builtin.command: update-topology --dry-run
      register: topo
      changed_when: false
      failed_when: >-
        topo.stdout_lines | select('search', nvl_cluster_uuid ~ '.' ~ nvl_clique_id ~ ' +S-') | list | length
        != groups['workers'] | length
      when: scheduler == 'k3s'

    # Trays run only per-node agents (DaemonSets) and jobs; the add-ons'
    # controllers belong on the control-plane node (k3s' own kube-system
    # components are placed by k3s).
    - name: No add-on controllers run on the trays (k3s)
      ansible.builtin.shell: |
        for tray in {{ groups['workers'] | join(' ') }}; do
          kubectl get pods -A --field-selector spec.nodeName=$tray --no-headers \
            -o custom-columns='NS:.metadata.namespace,NAME:.metadata.name,OWNER:.metadata.ownerReferences[0].kind' \
            | awk -v t=$tray '$1 != "kube-system" && $3 != "DaemonSet" && $3 != "Job" && $3 != "RayCluster" {print t": "$1"/"$2" ("$3")"}'
        done
      register: misplaced
      changed_when: false
      failed_when: misplaced.stdout | length > 0
      when: scheduler == 'k3s'

# KubeRay (kuberay: true): the dashboard and the API server answer at the
# dashboard's name from the host, as from a browser, the dashboard points
# the browser at the API server there, and the API server serves Ray's
# resources and the Ray dashboard of a KubeRay service.
- name: KubeRay
  hosts: controller
  tasks:
    - name: KubeRay
      when: scheduler == 'k3s' and kuberay | bool
      block:
        - name: Look up the bridge network
          ansible.builtin.command: incus network get {{ incus_bridge }} ipv4.address
          register: bridge
          delegate_to: localhost
          changed_when: false

        - name: Work out the dashboards' names
          ansible.builtin.set_fact:
            kuberay_url: >-
              http://{{ 'kuberay.' ~ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host ~ '.nip.io'
                        if kuberay_domain == 'auto' else kuberay_domain }}
            kuberay_history_url: >-
              http://{{ 'ray-history.' ~ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host ~ '.nip.io'
                        if kuberay_history_domain == 'auto' else kuberay_history_domain }}

        - name: The dashboard serves its pages
          ansible.builtin.uri:
            url: "{{ kuberay_url }}/jobs"
            return_content: true
          register: page
          delegate_to: localhost
          failed_when: page.status != 200 or page.content is not search('app/jobs/page')

        - name: The dashboard points the browser at the API server behind the same name
          ansible.builtin.uri:
            url: "{{ kuberay_url }}/api/config"
          register: config
          delegate_to: localhost
          failed_when: config.json.apiserver.domain != kuberay_url or config.json.apiserver.rayApiPath != '/apis/ray.io/v1'

        - name: The API server lists Ray jobs and clusters
          ansible.builtin.uri:
            url: "{{ kuberay_url }}/apis/ray.io/v1/namespaces/{{ cluster_users[0].name }}/{{ item.path }}"
          loop:
            - {path: rayjobs, kind: RayJobList}
            - {path: rayclusters, kind: RayClusterList}
          loop_control:
            label: "{{ item.path }}"
          register: lists
          delegate_to: localhost
          failed_when: lists.json.kind != item.kind

        - name: Check for the frameworks venv
          ansible.builtin.stat:
            path: "{{ frameworks_venv }}/bin/python"
          register: venv

        # The ray-job example's cluster is gone a minute and a half after the
        # job; its collectors uploaded its logs to RustFS. The dashboard's
        # History pages read them through the dashboard's server, as here.
        - name: The finished RayJob's driver log is in the dashboard's History
          vars:
            rayjob: >-
              {{ hostvars[groups['login'][0]].jobs.results | default([])
                 | selectattr('item.manifest', 'equalto', 'ray-job.yaml') | rejectattr('skipped', 'defined')
                 | map(attribute='stdout') | first | default('') | trim }}
          when: rayjob != ''
          ansible.builtin.shell: |
            set -euo pipefail
            api={{ kuberay_url }}/api/historyserver
            jar=$(mktemp); trap 'rm -f $jar' EXIT
            read -r name session < <(curl -sf $api/clusters \
                | jq -r '.[] | select(.ownerName == "{{ rayjob }}") | "\(.name) \(.sessionName)"' | head -1)
            [ -n "$session" ]
            curl -sf -c $jar "$api/enter_cluster/{{ cluster_users[0].name }}/$name/$session" >/dev/null
            for node in $(curl -sf -b $jar "$api/nodes?view=summary" | jq -r '.data.summary[].raylet.nodeId'); do
                file=$(curl -sf -b $jar "$api/api/v0/logs?node_id=$node" \
                    | jq -r '[.data.result[][]] | map(select(startswith("job-driver-"))) | .[0] // empty')
                [ -n "$file" ] && curl -sf -b $jar "$api/api/v0/logs/file?node_id=$node&filename=$file&lines=20"
            done
          args:
            executable: /bin/bash
          register: history
          delegate_to: localhost
          changed_when: false
          until: history.rc == 0 and history.stdout is search('8 tasks on')
          retries: 24
          delay: 10

        # The finished job's Logs link on the Jobs page (its cluster's Ray
        # dashboard, now gone) leads to Ray's dashboard for finished clusters
        # on its Jobs page, with the cluster selected, listing the job.
        - name: The finished RayJob's Logs link leads to its history in Ray's dashboard
          vars:
            rayjob: >-
              {{ hostvars[groups['login'][0]].jobs.results | default([])
                 | selectattr('item.manifest', 'equalto', 'ray-job.yaml') | rejectattr('skipped', 'defined')
                 | map(attribute='stdout') | first | default('') | trim }}
          when: rayjob != ''
          ansible.builtin.shell: |
            set -euo pipefail
            ns={{ cluster_users[0].name }}
            jar=$(mktemp); trap 'rm -f $jar' EXIT
            name=$(curl -sf {{ kuberay_url }}/api/historyserver/clusters \
                | jq -r '.[] | select(.ownerName == "{{ rayjob }}") | .name' | head -1)
            open=$(curl -s -o /dev/null -w '%{redirect_url}' \
                "{{ kuberay_url }}/api/v1/namespaces/$ns/services/$name-head-svc:8265/proxy/")
            [ "$open" = "{{ kuberay_history_url }}/open/$ns/$name" ] || { echo "Logs link went to '$open'"; exit 1; }
            landing=$(curl -s -c $jar -o /dev/null -w '%{redirect_url}' "$open")
            [ "$landing" = "{{ kuberay_history_url }}/#/jobs" ] || { echo "/open went to '$landing'"; exit 1; }
            curl -sf -b $jar {{ kuberay_history_url }}/api/jobs/ | jq -e 'map(.submission_id) | any(startswith("{{ rayjob }}-"))'
          args:
            executable: /bin/bash
          delegate_to: localhost
          changed_when: false

        # The dashboard's link to a cluster's Ray dashboard: the API server
        # proxies it from KubeRay's head service.
        - name: A Ray cluster created through the API server shows its Ray dashboard
          when: venv.stat.exists
          vars:
            cluster: test-raycluster
            ray_namespace: "{{ cluster_users[0].name }}"
            container:
              name: ray-head
              image: "{{ k3s_pod_image }}"
              env: [{name: PATH, value: "{{ frameworks_venv }}/bin:/usr/local/bin:/usr/bin:/bin"}]
              resources: {requests: {cpu: "1", memory: 2Gi}}
              volumeMounts: [{name: shared, mountPath: /shared}]
          block:
            - name: Create a head-only Ray cluster
              ansible.builtin.uri:
                url: "{{ kuberay_url }}/apis/ray.io/v1/namespaces/{{ ray_namespace }}/rayclusters"
                method: POST
                body_format: json
                body:
                  apiVersion: ray.io/v1
                  kind: RayCluster
                  metadata: {name: "{{ cluster }}", labels: {kueue.x-k8s.io/queue-name: "{{ k3s_queue }}"}}
                  spec:
                    headGroupSpec:
                      rayStartParams: {num-cpus: "1"}
                      template:
                        spec:
                          securityContext: {runAsUser: "{{ cluster_users[0].uid }}", runAsGroup: "{{ cluster_users[0].uid }}"}
                          containers: ["{{ container }}"]
                          volumes: [{name: shared, hostPath: {path: /shared, type: Directory}}]
                status_code: 201
              delegate_to: localhost

            - name: Wait for it to be ready
              ansible.builtin.command: kubectl -n {{ ray_namespace }} get raycluster {{ cluster }} -o jsonpath={.status.state}
              register: state
              until: state.stdout == 'ready'
              retries: 36
              delay: 5
              changed_when: false

            - name: Prometheus scrapes its metrics
              ansible.builtin.uri:
                url: http://localhost:9090/api/v1/query?query={{ ('ray_node_cpu_count{ray_io_cluster="' ~ cluster ~ '"}') | urlencode }}
              register: ray_metrics
              until: ray_metrics.json.data.result | length > 0
              retries: 12
              delay: 5

            - name: Its Ray dashboard answers through the API server
              ansible.builtin.uri:
                url: "{{ kuberay_url }}/api/v1/namespaces/{{ ray_namespace }}/services/{{ cluster }}-head-svc:8265/proxy/api/version"
              register: version
              delegate_to: localhost
              failed_when: version.json.ray_version is not defined
          always:
            - name: Delete the Ray cluster
              ansible.builtin.uri:
                url: "{{ kuberay_url }}/apis/ray.io/v1/namespaces/{{ ray_namespace }}/rayclusters/{{ cluster }}"
                method: DELETE
                status_code: [200, 202, 404]
              delegate_to: localhost

# Ray's Grafana dashboards (KubeRay), which Ray's dashboard embeds panels
# of: provisioned, and readable without a login as embedding needs.
- name: Ray's Grafana dashboards
  hosts: controller
  tasks:
    - name: Ray's default dashboard is in Grafana, for anonymous viewers too
      ansible.builtin.uri:
        url: http://localhost:{{ grafana_port }}/api/dashboards/uid/rayDefaultDashboard
      register: ray_dashboard
      failed_when: ray_dashboard.status != 200 or ray_dashboard.json.meta.folderTitle != 'Ray'
      when: scheduler == 'k3s' and kuberay | bool

# Run:ai (runai: true): the cluster connected to its control plane, GPU
# metrics from the DCGM exporter in Run:ai's Prometheus, and a training
# workload submitted through the API, scheduled by Run:ai onto GPUs.
- name: NVIDIA Run:ai
  hosts: controller
  vars:
    project: test
    workload: test-gpus
    fractions: [test-half-a, test-half-b]
    gpus: 2
  tasks:
    - name: Run:ai
      when: scheduler == 'k3s' and runai | bool
      block:
        - name: The cluster is connected with every required dependency
          ansible.builtin.shell: >-
            runai-api GET /v1/k8s/clusters/$(runai-api GET /v1/k8s/clusters
            | jq -r '.[] | select(.name == "{{ runai_cluster_name }}") | .uuid')
          register: cluster
          changed_when: false
          failed_when: >-
            (cluster.stdout | from_json).status.state != 'Connected'
            or (cluster.stdout | from_json).status.dependencies.required | dict2items
               | rejectattr('value.available') | list | length > 0

        - name: Run:ai's Prometheus has DCGM metrics for every GPU
          ansible.builtin.command: >-
            kubectl get --raw
            '/api/v1/namespaces/runai/services/prometheus-operated:9090/proxy/api/v1/query?query=count(DCGM_FI_DEV_FB_FREE)'
          register: dcgm
          changed_when: false
          retries: 12
          delay: 10
          until: >-
            dcgm.rc == 0 and (dcgm.stdout | from_json).data.result | length == 1
            and (dcgm.stdout | from_json).data.result[0].value[1] | int == groups['workers'] | length * fakegpu_count

        - name: Look up the cluster and its node pool
          ansible.builtin.shell: |
            set -e
            runai-api GET /v1/k8s/clusters | jq -r '.[] | select(.name == "{{ runai_cluster_name }}") | .uuid'
            runai-api GET /api/v1/node-pools | jq -r '.nodepools[] | select(.name == "default") | .id'
          register: ids
          changed_when: false

        - name: Read the test project
          ansible.builtin.command: runai-api GET /api/v1/org-unit/projects
          register: projects
          changed_when: false

        - name: Create the test project
          ansible.builtin.command:
            argv:
              - runai-api
              - POST
              - /api/v1/org-unit/projects
              - "{{ {'name': project, 'clusterId': ids.stdout_lines[0],
                    'resources': [{'nodePool': {'id': ids.stdout_lines[1]}, 'gpu': {'deserved': gpus}}]} | to_json }}"
          when: project not in (projects.stdout | from_json).projects | map(attribute='name')

        - name: Read the test project again
          ansible.builtin.command: runai-api GET /api/v1/org-unit/projects
          register: projects
          changed_when: false

        - name: Remove a workload left from an earlier run
          ansible.builtin.shell: |
            for id in $(runai-api GET '/api/v1/workloads?filterBy=name=={{ workload }}' | jq -r '.workloads[].id'); do
              runai-api DELETE /api/v1/workloads/trainings/$id >/dev/null
            done
            kubectl -n runai-{{ project }} wait --for=delete pod -l workloadName={{ workload }} --timeout=120s
          changed_when: false

        - name: Submit a training workload through the API
          ansible.builtin.command:
            argv:
              - runai-api
              - POST
              - /api/v1/workloads/trainings
              - "{{ {'name': workload, 'clusterId': ids.stdout_lines[0], 'projectId': project_id,
                    'spec': {'image': k3s_pod_image, 'command': 'nvidia-smi', 'args': '-L',
                             'compute': {'gpuDevicesRequest': gpus}}} | to_json }}"
          vars:
            project_id: >-
              {{ (projects.stdout | from_json).projects | selectattr('name', 'equalto', project)
                 | map(attribute='id') | first }}
          register: submitted
          changed_when: true

        - name: The workload's pod ran on a tray, scheduled by Run:ai
          ansible.builtin.command: >-
            kubectl -n runai-{{ project }} get pods -l workloadName={{ workload }}
            -o jsonpath='{.items[0].status.phase} {.items[0].spec.schedulerName} {.items[0].spec.nodeName}'
          register: pod
          changed_when: false
          retries: 30
          delay: 5
          until: pod.stdout is match('^Succeeded runai-scheduler (' ~ groups['workers'] | join('|') ~ ')$')

        - name: It saw the GPUs it asked for
          ansible.builtin.command: kubectl -n runai-{{ project }} logs -l workloadName={{ workload }}
          register: logs
          changed_when: false
          failed_when: >-
            logs.stdout_lines | select('search', '^GPU [0-9]+: NVIDIA ') | list | length != gpus

        - name: Delete the workload
          ansible.builtin.command: runai-api DELETE /api/v1/workloads/trainings/{{ (submitted.stdout | from_json).workloadId }}
          changed_when: true

        # GPU fractions: two workloads asking for half a GPU each share one,
        # and NVIDIA's GPU fractioning holds each to its half of the memory.
        - name: Remove fractions left from an earlier run
          ansible.builtin.shell: |
            for w in {{ fractions | join(' ') }}; do
              for id in $(runai-api GET "/api/v1/workloads?filterBy=name==$w" | jq -r '.workloads[].id'); do
                runai-api DELETE /api/v1/workloads/trainings/$id >/dev/null
              done
              kubectl -n runai-{{ project }} wait --for=delete pod -l workloadName=$w --timeout=120s
            done
          changed_when: false

        - name: Submit two half-GPU workloads
          ansible.builtin.command:
            argv:
              - runai-api
              - POST
              - /api/v1/workloads/trainings
              - "{{ {'name': item, 'clusterId': ids.stdout_lines[0], 'projectId': project_id,
                    'spec': {'image': k3s_pod_image, 'command': 'bash',
                             'args': '-c \"echo ' ~ probe ~ ' | base64 -d | python3 -u\"',
                             'compute': {'gpuDevicesRequest': 1, 'gpuRequestType': 'portion',
                                         'gpuPortionRequest': 0.5}}} | to_json }}"
          vars:
            project_id: >-
              {{ (projects.stdout | from_json).projects | selectattr('name', 'equalto', project)
                 | map(attribute='id') | first }}
            probe: "{{ lookup('file', playbook_dir ~ '/files/gpu-fraction-probe.py') | b64encode }}"
          loop: "{{ fractions }}"
          register: fraction_workloads
          changed_when: true

        - name: Read what each fraction sees
          ansible.builtin.command: kubectl -n runai-{{ project }} logs -l workloadName={{ item }}
          loop: "{{ fractions }}"
          register: probes
          changed_when: false
          retries: 30
          delay: 5
          until: probes.stdout is search('alloc_beyond=')

        - name: Both share one GPU, each held to half of its memory
          ansible.builtin.assert:
            that:
              - seen | map(attribute='gpu') | unique | list | length == 1
              - seen | map(attribute='gpu') | first is match('^GPU-')
              - seen | rejectattr('limit_mib', 'equalto', (fakegpu_mem_mb | int // 2) | string) | list | length == 0
              - seen | rejectattr('total_mib', 'equalto', (fakegpu_mem_mb | int // 2) | string) | list | length == 0
              - seen | rejectattr('alloc_within', 'equalto', '0') | list | length == 0
              - seen | rejectattr('alloc_beyond', 'equalto', '2') | list | length == 0
            fail_msg: "{{ seen | to_json }}"
            quiet: true
          vars:
            seen: >-
              {{ probes.results | map(attribute='stdout_lines')
                 | map('map', 'split', '=') | map('items2dict', key_name=0, value_name=1) | list }}

        - name: Delete the fractions
          ansible.builtin.command: runai-api DELETE /api/v1/workloads/trainings/{{ (item.stdout | from_json).workloadId }}
          loop: "{{ fraction_workloads.results }}"
          loop_control:
            label: "{{ item.item }}"
          changed_when: true

# After the example jobs: the Slurm epilog reset each job's GPUs (handover),
# and no GPU is left needing recovery (with either scheduler).
- name: GPU handover
  hosts: workers
  tasks:
    - name: The epilog reset the GPUs of the example jobs (Slurm)
      ansible.builtin.command: journalctl -t slurm-epilog --since -3h --no-pager
      register: epilog
      changed_when: false
      failed_when: epilog.stdout is not search('GPUs [0-9,]+ reset')
      when: scheduler == 'slurm' and gpu_handover_reset

    - name: No GPU needs a reset or other recovery
      ansible.builtin.command: nvidia-smi -q
      register: recovery
      changed_when: false
      failed_when: >-
        recovery.stdout_lines | select('search', 'GPU Recovery Action') | list | length != fakegpu_count
        or recovery.stdout_lines | select('search', 'GPU Recovery Action') | reject('search', ': None$') | list | length > 0

- name: Metrics
  hosts: controller
  tasks:
    - name: All Prometheus targets are up
      ansible.builtin.uri:
        url: http://localhost:9090/api/v1/targets
      register: targets
      failed_when: targets.json.data.activeTargets | rejectattr('health', 'equalto', 'up') | list | length > 0

    - name: Grafana serves the provisioned dashboards
      ansible.builtin.uri:
        url: http://localhost:{{ grafana_port }}/api/search?type=dash-db
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
      register: dashboards
      failed_when: dashboards.json | length < grafana_dashboards | length + 2

    - name: Scheduler GPU allocation and NVLink fabric metrics are collected
      ansible.builtin.uri:
        url: http://localhost:9090/api/v1/query?query={{ item.query | urlencode }}
      loop:
        - { query: sched_node_gpus_alloc, count: "{{ groups['workers'] | length }}" }
        - { query: nvlink_gpu_links, count: "{{ fakegpu_count * groups['workers'] | length }}" }
        - { query: nvswitch_ports_up, count: "{{ nvswitch_count }}" }
        - { query: idrac_system_power_on == 1, count: "{{ groups['bmc'] | length }}" }
        - { query: node_infiniband_port_data_transmitted_bytes_total, count: "{{ ib_hcas_per_node * groups['workers'] | length }}" }
      loop_control:
        label: "{{ item.query }}"
      register: series
      retries: 6
      delay: 10
      until: series.json.data.result | length == item.count | int

    - name: GPU metrics for every GPU
      ansible.builtin.uri:
        url: http://localhost:9090/api/v1/query?query=nvidia_smi_power_draw_watts
      register: power
      failed_when: power.json.data.result | length != fakegpu_count * groups['workers'] | length
