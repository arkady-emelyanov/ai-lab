# Creates the Incus containers, volumes and wiring (idempotent), and deletes
# the instances of components switched off (bmc, nvswitch, ...).
# Runs on the host; needs membership in the incus-admin group.
- name: Provision Incus instances
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # The instances the settings enable, and every instance the lab can have.
    instances: "{{ lab_instances }}"
    all_instances: "{{ groups['cluster'] + groups['storage'] + groups['nvswitch'] + groups['bmc'] }}"
    secrets: "{{ playbook_dir | dirname }}/.secrets"
    # The BMCs reach the Incus API here (with BMCs only).
    incus_api_address: "{{ api.results[0].stdout.split('/')[0] }}:{{ incus_api_port }}"
    # --project flag for an instance
    proj: "--project {{ hostvars[item].ansible_incus_project }}"
    limits: >-
      {{ instance_limits | combine(instance_limits_k3s if scheduler == 'k3s' else {})
         | combine(instance_limits_runai if scheduler == 'k3s' and runai | bool else {}) }}
    # Fixed address of an instance on the bridge (needs `api`, read below).
    address: "{{ api.results[0].stdout.split('/')[0].rsplit('.', 1)[0] }}.{{ hostvars[item].ip_host }}"
    # Volumes whose data outlives the instances (make down keeps them).
    data_volumes: "{{ [shared_volume, rustfs_volume, juicefs_meta_volume] }}"
  tasks:
    - name: Check the settings
      ansible.builtin.include_tasks: tasks/check-settings.yml

    # ---- data volumes belong to these secrets ------------------------------------
    # The data volumes outlive make down and the checkout; .secrets/ is
    # regenerated when missing (a new clone, a deleted directory). The object
    # store and JuiceFS on the volumes only work with the credentials they were
    # created with, so new secrets on old volumes give a lab that builds but
    # cannot read /pfs. Each data volume carries a fingerprint of those
    # secrets; a different one stops the build here, before anything changes.

    - name: Fingerprint the secrets the lab's data depends on
      ansible.builtin.shell: cat {{ secrets }}/rustfs.access {{ secrets }}/rustfs.secret {{ secrets }}/redis.pass | sha256sum | cut -c1-16
      register: fingerprint
      changed_when: false

    - name: Read the fingerprints of existing data volumes
      ansible.builtin.command: incus storage volume get {{ shared_pool }} {{ item }} user.ai-lab.secrets
      loop: "{{ data_volumes }}"
      register: stamps
      changed_when: false
      failed_when: stamps.rc != 0 and 'not found' not in stamps.stderr

    - name: Stop if the data volumes were created with other secrets
      ansible.builtin.assert:
        that: foreign | length == 0
        fail_msg: >-
          The lab's data volumes {{ foreign | join(', ') }} (pool {{ shared_pool }}) were created with other secrets
          than .secrets/ in this checkout (another checkout, or .secrets/ was regenerated), so the object store and
          /pfs on them cannot be used. Either put back the .secrets/ directory they were created with, or delete
          them (and the lab's data) with `make purge`, then run `make up` again.
        quiet: true
      vars:
        foreign: >-
          {{ stamps.results | selectattr('rc', 'equalto', 0) | rejectattr('stdout', 'in', ['', fingerprint.stdout])
             | map(attribute='item') | list }}

    # ---- GPU trays project and Incus API for BMC power control ------------------

    - name: Create the GPU trays project (shares default profiles, networks, volumes)
      ansible.builtin.command: >-
        incus project create {{ trays_project }}
        -c features.images=false -c features.profiles=false
        -c features.networks=false -c features.storage.volumes=false
      register: project
      changed_when: project.rc == 0
      failed_when: project.rc != 0 and 'already exists' not in project.stderr

    - name: Read the bridge address and the current API listener
      ansible.builtin.command: "{{ item }}"
      loop:
        - incus network get {{ incus_bridge }} ipv4.address
        - incus config get core.https_address
      register: api
      changed_when: false

    - name: Expose the Incus API on the bridge only
      ansible.builtin.command: incus config set core.https_address {{ incus_api_address }}
      when: bmc | bool and api.results[1].stdout != incus_api_address

    # Without BMCs nothing uses it; another listener is left alone.
    - name: Close the BMCs' Incus API listener without BMCs
      ansible.builtin.command: incus config unset core.https_address
      when: not bmc | bool and api.results[1].stdout == incus_api_address

    # `trust remove` takes a fingerprint, not the certificate's name.
    - name: Revoke the BMC certificates without BMCs
      ansible.builtin.shell: |
        set -o pipefail
        incus config trust list --format csv -c nf | awk -F, -v n={{ item }} '$1 == n {print $2}' |
            while read -r fp; do incus config trust remove "$fp"; echo removed; done
      args:
        executable: /bin/bash
      loop: "{{ groups['tray_bmc'] }}"
      when: not bmc | bool
      register: revoked
      changed_when: "'removed' in revoked.stdout"

    - name: BMC credentials for tray power control
      when: bmc | bool
      block:
        - name: Create the BMC secrets directory
          ansible.builtin.file:
            path: "{{ secrets }}/bmc"
            state: directory
            mode: "0700"

        - name: Generate a client certificate per BMC
          ansible.builtin.command: >-
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 3650
            -subj /CN={{ item }} -keyout {{ secrets }}/bmc/{{ item }}.key -out {{ secrets }}/bmc/{{ item }}.crt
          args:
            creates: "{{ secrets }}/bmc/{{ item }}.crt"
          loop: "{{ groups['tray_bmc'] }}"

        - name: List trusted certificates
          ansible.builtin.command: incus config trust list --format json
          register: trust
          changed_when: false

        - name: Trust BMC certificates for the trays project only
          ansible.builtin.command: >-
            incus config trust add-certificate {{ secrets }}/bmc/{{ item }}.crt
            --name {{ item }} --restricted --projects {{ trays_project }}
          loop: "{{ groups['tray_bmc'] }}"
          when: item not in (trust.stdout | from_json | map(attribute='name'))

        - name: Save the Incus server certificate for pinning
          ansible.builtin.shell: incus query /1.0 | jq -r .environment.certificate > {{ secrets }}/bmc/incus-server.crt
          changed_when: false

    # ---- instances ----------------------------------------------------------------

    - name: Check which instances exist
      ansible.builtin.command: incus list --all-projects --format json
      register: incus_list
      changed_when: false

    # Instances of components switched off go, as with make down (volumes
    # stay). The trays' sideband volumes outlive them, so what they set there
    # goes first: a tray BMC's disabled NVLink ports, the switch tray BMC's
    # disabled switch ports, the partition controller's partitions (the GPUs
    # return to the default one at their next reset).
    - name: Delete the instances of disabled components
      ansible.builtin.shell: |
        set -e
        p="--project {{ hostvars[item].ansible_incus_project }}"
        if [ -n "{{ leftovers }}" ]; then
            incus start {{ item }} $p 2>/dev/null || true
            incus exec {{ item }} $p -- sh -c 'rm -f {{ leftovers }}'
        fi
        incus delete --force {{ item }} $p
      vars:
        leftovers: >-
          {{ sideband_bmc_path ~ '/nvlink-disabled' if item in groups['tray_bmc']
             else '/var/lib/fakebmc/sideband/*/nvlink-disabled-switch' if item in groups['nvswitch_bmc']
             else '/var/lib/fakenmxc/sideband/*/fabric-clique' if item in groups['nvswitch'] else '' }}
      loop: "{{ incus_list.stdout | from_json | map(attribute='name') | select('in', all_instances) | reject('in', instances) | list }}"

    # Fixed addresses from the first boot. They lie in the bridge's DHCP
    # range, so an instance booting unpinned can lease another's address and
    # keep it from that instance when it is pinned.
    - name: Launch missing instances
      ansible.builtin.command: >-
        incus launch {{ incus_image }} {{ item }} {{ proj }}
        --profile {{ incus_profile }}
        --device eth0,ipv4.address={{ address }}
        -c limits.cpu={{ limits[role].cpu }}
        -c limits.memory={{ limits[role].memory }}
        -c security.nesting=true
      vars:
        role: "{{ ['controller', 'login', 'workers', 'storage', 'nvswitch', 'bmc'] | select('in', hostvars[item].group_names) | first }}"
      loop: "{{ instances }}"
      when: item not in (incus_list.stdout | from_json | map(attribute='name'))

    # Trays get whole physical cores of their own; everything else shares the
    # rest. With a CPU count, Incus places and rebalances instances itself and
    # lets a tray share cores with the controller, which slows its GPUs.
    - name: Work out the CPU placement from the host's cores
      ansible.builtin.command: >-
        {{ playbook_dir }}/files/cpu-placement {{ limits.workers.cpu }} {{ groups['workers'] | join(' ') }}
        -- {{ instances | difference(groups['workers']) | join(' ') }}
      register: placement
      changed_when: false

    # Pinned cores, or the CPU count when the host has too few cores to pin
    # (also for instances created with other limits than the current ones).
    # A k3s node whose CPUs change gets its kubelet restarted: the kubelet
    # reads the node's capacity and copies its CPUs into the pod cgroup once,
    # at start, so pods would keep only the overlap of old and new CPUs.
    - name: Pin instances to their cores
      ansible.builtin.shell: |
        want={{ (placement.stdout | from_json)[item] | default(limits[role].cpu) }}
        [ "$(incus config get {{ item }} limits.cpu {{ proj }})" = "$want" ] && exit 0
        incus config set {{ item }} limits.cpu=$want {{ proj }}
        incus exec {{ item }} {{ proj }} -- systemctl try-restart k3s.service k3s-agent.service || true
        echo changed
      vars:
        role: "{{ ['controller', 'login', 'workers', 'storage', 'nvswitch', 'bmc'] | select('in', hostvars[item].group_names) | first }}"
      loop: "{{ instances }}"
      register: pinned
      changed_when: "'changed' in pinned.stdout"

    # Memory limits changed in the settings (instance_limits*, runai) reach
    # existing instances; Incus applies them to a running container at once,
    # a k3s node's kubelet when it restarts.
    - name: Apply memory limits
      ansible.builtin.shell: |
        want={{ limits[role].memory }}
        [ "$(incus config get {{ item }} limits.memory {{ proj }})" = "$want" ] && exit 0
        incus config set {{ item }} limits.memory=$want {{ proj }}
        incus exec {{ item }} {{ proj }} -- systemctl try-restart k3s.service k3s-agent.service || true
        echo changed
      vars:
        role: "{{ ['controller', 'login', 'workers', 'storage', 'nvswitch', 'bmc'] | select('in', hostvars[item].group_names) | first }}"
      loop: "{{ instances }}"
      register: memory
      changed_when: "'changed' in memory.stdout"

    # Let first boot (cloud-init) finish before restarting anything.
    - name: Wait for first boot to finish
      ansible.builtin.command: incus exec {{ item }} {{ proj }} -- cloud-init status --wait
      loop: "{{ instances }}"
      changed_when: false
      failed_when: false

    # Fixed addresses: daemons such as slurmctld resolve peers once, so a tray
    # that reboots must come back on the same address. New instances are
    # launched pinned; this pins instances created before that.
    - name: Pin static addresses
      ansible.builtin.shell: |
        want={{ address }}
        have=$(incus config device get {{ item }} eth0 ipv4.address {{ proj }} 2>/dev/null || true)
        [ "$have" = "$want" ] && exit 0
        incus config device override {{ item }} eth0 ipv4.address=$want {{ proj }} 2>/dev/null \
          || incus config device set {{ item }} eth0 ipv4.address=$want {{ proj }}
        incus restart {{ item }} {{ proj }}
        echo changed
      loop: "{{ instances }}"
      register: pin
      changed_when: "'changed' in pin.stdout"

    # An instance whose address was leased to another one when it restarted
    # keeps a dynamic address; now that every instance is pinned, a restart
    # gets it its own.
    - name: Check every instance holds its fixed address
      ansible.builtin.shell: |
        want={{ address }}
        current() {
          incus query "/1.0/instances/{{ item }}/state?project={{ hostvars[item].ansible_incus_project }}" \
            | jq -r '[.network.eth0.addresses[]? | select(.family == "inet") | .address][0] // ""'
        }
        have=$(current)
        [ "$have" = "$want" ] && exit 0
        echo "{{ item }}: $have, want $want: restarting"
        incus restart {{ item }} {{ proj }}
        for _ in $(seq 30); do
          sleep 2
          [ "$(current)" = "$want" ] && echo changed && exit 0
        done
        echo "{{ item }} did not get $want" >&2
        exit 1
      loop: "{{ instances }}"
      register: held
      changed_when: "'changed' in held.stdout"

    # ---- storage --------------------------------------------------------------------

    # A custom volume rather than a host bind mount: it needs no idmapped-mount
    # support on the host, and all instances share one ID map.
    - name: Create the shared volume
      ansible.builtin.command: incus storage volume create {{ shared_pool }} {{ shared_volume }}
      register: vol
      changed_when: vol.rc == 0
      failed_when: vol.rc != 0 and 'already exists' not in vol.stderr

    - name: Attach the shared volume
      ansible.builtin.command: >-
        incus storage volume attach {{ shared_pool }} {{ shared_volume }} {{ item }} {{ shared_mount }} {{ proj }}
      loop: "{{ groups['cluster'] }}"
      register: mount
      changed_when: mount.rc == 0
      failed_when: mount.rc != 0 and 'already exists' not in mount.stderr

    - name: Create the node-local scratch pool
      ansible.builtin.command: >-
        incus storage create {{ scratch_pool }} {{ scratch_pool_driver }} size={{ scratch_pool_size }}
      register: pool
      changed_when: pool.rc == 0
      failed_when: pool.rc != 0 and 'already exists' not in pool.stderr

    - name: Create a scratch volume per worker
      ansible.builtin.command: >-
        incus storage volume create {{ scratch_pool }} scratch-{{ item }} size={{ scratch_size_gib }}GiB
      loop: "{{ groups['workers'] }}"
      register: scratch
      changed_when: scratch.rc == 0
      failed_when: scratch.rc != 0 and 'already exists' not in scratch.stderr

    - name: Attach scratch volumes
      ansible.builtin.command: >-
        incus storage volume attach {{ scratch_pool }} scratch-{{ item }} {{ item }} {{ scratch_mount }} {{ proj }}
      loop: "{{ groups['workers'] }}"
      register: attach
      changed_when: attach.rc == 0
      failed_when: attach.rc != 0 and 'already exists' not in attach.stderr

    - name: Create the object storage data volume
      ansible.builtin.command: incus storage volume create {{ shared_pool }} {{ rustfs_volume }}
      register: rv
      changed_when: rv.rc == 0
      failed_when: rv.rc != 0 and 'already exists' not in rv.stderr

    - name: Attach the object storage data volume
      ansible.builtin.command: >-
        incus storage volume attach {{ shared_pool }} {{ rustfs_volume }} {{ storage_host }} /var/lib/rustfs
      when: storage | bool
      register: ra
      changed_when: ra.rc == 0
      failed_when: ra.rc != 0 and 'already exists' not in ra.stderr

    - name: Create the JuiceFS metadata volume (Redis data)
      ansible.builtin.command: incus storage volume create {{ shared_pool }} {{ juicefs_meta_volume }}
      register: mv
      changed_when: mv.rc == 0
      failed_when: mv.rc != 0 and 'already exists' not in mv.stderr

    - name: Attach the JuiceFS metadata volume
      ansible.builtin.command: >-
        incus storage volume attach {{ shared_pool }} {{ juicefs_meta_volume }} {{ storage_host }} /var/lib/redis
      when: storage | bool
      register: ma
      changed_when: ma.rc == 0
      failed_when: ma.rc != 0 and 'already exists' not in ma.stderr

    # Volumes from before fingerprints existed are adopted as they are.
    - name: Record the secrets' fingerprint on the data volumes
      ansible.builtin.command: incus storage volume set {{ shared_pool }} {{ item.item }} user.ai-lab.secrets={{ fingerprint.stdout }}
      loop: "{{ stamps.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc != 0 or item.stdout != fingerprint.stdout

    # JuiceFS mounts through FUSE; unprivileged containers get /dev/fuse from Incus.
    - name: Give Slurm nodes /dev/fuse
      ansible.builtin.command: >-
        incus config device add {{ item }} fuse unix-char source=/dev/fuse path=/dev/fuse mode=0666 {{ proj }}
      loop: "{{ groups['cluster'] }}"
      register: fuse
      changed_when: fuse.rc == 0
      failed_when: fuse.rc != 0 and 'already exists' not in fuse.stderr

    # ---- GPU devices and BMC sideband ---------------------------------------------

    # Character devices with NVIDIA's major number, as on a real GPU node. Incus
    # creates them itself; unprivileged containers cannot mknod.
    - name: Add /dev/nvidia* device nodes to GPU trays
      ansible.builtin.command: >-
        incus config device add {{ item.0 }} {{ item.1.name }} unix-char
        path=/dev/{{ item.1.name }} major=195 minor={{ item.1.minor }} mode=0666 required=false
        --project {{ trays_project }}
      loop: "{{ groups['workers'] | product(gpu_devices) | list }}"
      vars:
        gpu_devices: >-
          {{ range(fakegpu_count) | map('string') | map('regex_replace', '^(.*)$', '{"name": "nvidia\1", "minor": \1}')
             | map('from_json') | list + [{'name': 'nvidiactl', 'minor': 255}] }}
      register: dev
      changed_when: dev.rc == 0
      failed_when: dev.rc != 0 and 'already exists' not in dev.stderr

    # IMEX: the management capability the IMEX daemon opens and the IMEX
    # channel a workload needs to share memory over NVLink between trays, as
    # the driver creates them on a GB200 node (NVIDIA's DRA driver hands
    # them to pods; fakegpu_driver_root has their device numbers).
    - name: Add the IMEX device nodes to GPU trays
      ansible.builtin.command: >-
        incus config device add {{ item.0 }} {{ item.1.name }} unix-char
        path={{ item.1.path }} major={{ item.1.major }} minor={{ item.1.minor }} mode={{ item.1.mode }} required=false
        --project {{ trays_project }}
      loop: "{{ groups['workers'] | product(imex_devices) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1.path }}"
      vars:
        imex_devices:
          - {name: nvidia-cap-imex, path: "/dev/nvidia-caps/nvidia-cap{{ fakegpu_imex_mgmt_minor }}",
             major: "{{ fakegpu_caps_major }}", minor: "{{ fakegpu_imex_mgmt_minor }}", mode: "0400"}
          - {name: imex-channel0, path: /dev/nvidia-caps-imex-channels/channel0,
             major: "{{ fakegpu_imex_channels_major }}", minor: 0, mode: "0666"}
      register: imex_dev
      changed_when: imex_dev.rc == 0
      failed_when: imex_dev.rc != 0 and 'already exists' not in imex_dev.stderr

    # kubelet's OOM watcher reads the kernel log; unprivileged containers
    # have no /dev/kmsg of their own.
    - name: Give Kubernetes nodes the kernel log (k3s)
      ansible.builtin.command: >-
        incus config device add {{ item }} kmsg unix-char source=/dev/kmsg path=/dev/kmsg {{ proj }}
      loop: "{{ groups['controller'] + groups['workers'] }}"
      when: scheduler == 'k3s'
      register: kmsg
      changed_when: kmsg.rc == 0
      failed_when: kmsg.rc != 0 and 'already exists' not in kmsg.stderr

    # The tray's own, whichever management services write into it.
    - name: Create a sideband volume per tray
      ansible.builtin.command: incus storage volume create {{ shared_pool }} sideband-{{ item }}
      loop: "{{ groups['workers'] }}"
      register: sb
      changed_when: sb.rc == 0
      failed_when: sb.rc != 0 and 'already exists' not in sb.stderr

    - name: Attach sideband volumes to trays (read-only) and their BMCs (read-write)
      ansible.builtin.command: >-
        incus config device add {{ item }} sideband disk
        pool={{ shared_pool }} source=sideband-{{ tray }}
        path={{ sideband_tray_path if tray == item else sideband_bmc_path }} readonly={{ tray == item }}
        --project {{ hostvars[item].ansible_incus_project }}
      vars:
        tray: "{{ hostvars[item].bmc_tray | default(item) }}"
      loop: "{{ groups['workers'] + groups['tray_bmc'] | select('in', instances) | list }}"
      register: sbdev
      changed_when: sbdev.rc == 0
      failed_when: sbdev.rc != 0 and 'already exists' not in sbdev.stderr

    # The switch tray's BMC (switch port state) and host (partitions) write
    # into every tray's sideband, each tray in its own directory.
    - name: Attach every tray's sideband to the switch tray
      ansible.builtin.command: >-
        incus config device add {{ item.1 }} sideband-{{ item.0 }} disk
        pool={{ shared_pool }} source=sideband-{{ item.0 }}
        path={{ '/var/lib/fakebmc' if item.1 in groups['bmc'] else '/var/lib/fakenmxc' }}/sideband/{{ item.0 }}
      loop: "{{ groups['workers'] | product((groups['nvswitch'] + groups['nvswitch_bmc']) | select('in', instances)) | list }}"
      register: swsb
      changed_when: swsb.rc == 0
      failed_when: swsb.rc != 0 and 'already exists' not in swsb.stderr

    - name: Create a telemetry volume per tray
      ansible.builtin.command: incus storage volume create {{ shared_pool }} telemetry-{{ item }}
      loop: "{{ groups['workers'] }}"
      register: tv
      changed_when: tv.rc == 0
      failed_when: tv.rc != 0 and 'already exists' not in tv.stderr

    # The tray's BMC reads its GPU sensors from it (the emulated I2C/SMBus
    # path to the GPUs), the switch tray host the NVLink traffic.
    - name: Attach telemetry volumes to trays (read-write), their BMCs and the switch tray host (read-only)
      ansible.builtin.command: >-
        incus config device add {{ item.1 }} telemetry-{{ item.0 }} disk
        pool={{ shared_pool }} source=telemetry-{{ item.0 }}
        path={{ telemetry_tray_path if item.1 == item.0 else telemetry_bmc_path if item.1 in groups['tray_bmc']
                else '/var/lib/fakenmxc/telemetry/' ~ item.0 }}
        readonly={{ item.1 != item.0 }} --project {{ hostvars[item.1].ansible_incus_project }}
      loop: >-
        {{ ((groups['workers'] | zip(groups['workers']) | list) + (groups['workers'] | product(groups['nvswitch']) | list)
            + (groups['tray_bmc'] | map('extract', hostvars, 'bmc_tray') | zip(groups['tray_bmc']) | list))
           | selectattr(1, 'in', instances) | list }}
      loop_control:
        label: "{{ item.1 }}: telemetry-{{ item.0 }}"
      register: tdev
      changed_when: tdev.rc == 0
      failed_when: tdev.rc != 0 and 'already exists' not in tdev.stderr

    # ---- wait for the instances -------------------------------------------------------

    - name: Wait for an IPv4 address on every instance
      ansible.builtin.command: incus list --all-projects --format json
      register: incus_state
      changed_when: false
      retries: 30
      delay: 2
      until: >-
        incus_state.stdout | from_json
        | selectattr('name', 'in', instances)
        | map(attribute='state.network.eth0.addresses')
        | map('selectattr', 'family', 'equalto', 'inet') | map('list') | select | list | length
        == instances | length

    - name: Wait for cloud-init to finish
      ansible.builtin.command: incus exec {{ item }} {{ proj }} -- cloud-init status --wait
      loop: "{{ instances }}"
      changed_when: false
      failed_when: false
