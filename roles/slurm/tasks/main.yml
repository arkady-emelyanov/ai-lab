- name: Install slurmctld
  ansible.builtin.apt:
    name: slurmctld
  when: inventory_hostname in groups['controller']

- name: Install slurmd
  ansible.builtin.apt:
    name: slurmd
  when: inventory_hostname in groups['workers']

- name: Write Slurm configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/slurm/{{ item }}
    mode: "0644"
  loop: [slurm.conf, cgroup.conf, gres.conf]
  notify:
    - Restart slurmctld
    - Restart slurmd

# Initial topology only: topograph (update-topology) owns it afterwards.
- name: Write the initial topology.conf
  ansible.builtin.template:
    src: topology.conf.j2
    dest: /etc/slurm/topology.conf
    mode: "0644"
    force: false
  notify:
    - Restart slurmctld
    - Restart slurmd

- name: Install the task prolog
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Lines printed as "export NAME=value" become part of each task's environment.
      echo "export SCRATCH={{ scratch_mount }}"
    dest: /etc/slurm/task_prolog.sh
    mode: "0755"
  when: inventory_hostname in groups['workers']

# Hands the job's GPUs to the next job, as between tenants on GB200: a GPU
# reset clears the GPU's memory and state and applies a pending NVLink
# partition change; afterwards the GPUs must be free and need no recovery.
- name: Install the epilog (GPU handover)
  ansible.builtin.copy:
    content: |
      #!/bin/bash
      # Slurm Epilog (root, on the job's nodes). A non-zero exit drains the node.
      [ -n "$SLURM_JOB_GPUS" ] || exit 0
      log() { logger -t slurm-epilog "job $SLURM_JOB_ID: $*"; }
      if ! out=$(nvidia-smi --gpu-reset -i "$SLURM_JOB_GPUS" 2>&1); then
          log "GPU reset of $SLURM_JOB_GPUS failed: $out"
          exit 1
      fi
      busy=$(nvidia-smi -i "$SLURM_JOB_GPUS" --query-compute-apps=pid --format=csv,noheader | wc -l)
      pending=$(nvidia-smi -i "$SLURM_JOB_GPUS" -q | grep "GPU Recovery Action" | grep -vc ": None$")
      if [ "$busy" -ne 0 ] || [ "$pending" -ne 0 ]; then
          log "GPUs $SLURM_JOB_GPUS not clean after reset: $busy processes, $pending recovery actions"
          exit 1
      fi
      log "GPUs $SLURM_JOB_GPUS reset"
    dest: /etc/slurm/epilog.sh
    mode: "0755"
  when: inventory_hostname in groups['workers']

- name: Create Slurm state and log directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  loop: [/var/lib/slurm/slurmctld, /var/lib/slurm/slurmd, /var/log/slurm]

- name: Start slurmctld
  ansible.builtin.service:
    name: slurmctld
    state: started
    enabled: true
  when: inventory_hostname in groups['controller']

- name: Start slurmd
  ansible.builtin.service:
    name: slurmd
    state: started
    enabled: true
  when: inventory_hostname in groups['workers']
