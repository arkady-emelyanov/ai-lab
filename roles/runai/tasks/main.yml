# NVIDIA Run:ai on the k3s cluster (runai: true), from the controller: the
# prerequisites, the control plane, the cluster's registration with the
# control plane, and the cluster services. See docs/runai.md.

- name: Look up the bridge network
  ansible.builtin.command: incus network get {{ incus_bridge }} ipv4.address
  register: bridge
  delegate_to: localhost
  changed_when: false

- name: Work out the Run:ai domain
  ansible.builtin.set_fact:
    runai_fqdn: >-
      {{ 'runai.' ~ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host ~ '.nip.io'
         if runai_domain == 'auto' else runai_domain }}

# ---- certificates -------------------------------------------------------------------
# A certificate authority of the lab's own signs the domain's certificate
# (the domain and its subdomains). Browsers trust it once it is imported
# (.secrets/runai/ca.crt).

- name: Create the Run:ai certificates directory
  ansible.builtin.file:
    path: "{{ runai_secrets }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Create the lab's certificate authority
  ansible.builtin.command: >-
    openssl req -x509 -newkey rsa:3072 -nodes -days 3650 -subj "/CN=ai-lab certificate authority"
    -keyout ca.key -out ca.crt
  args:
    chdir: "{{ runai_secrets }}"
    creates: ca.crt
  delegate_to: localhost

- name: Issue the certificate of the domain
  ansible.builtin.shell: |
    set -e
    openssl req -new -newkey rsa:2048 -nodes -subj "/CN={{ runai_fqdn }}" \
      -keyout {{ runai_fqdn }}.key -out {{ runai_fqdn }}.csr
    printf 'subjectAltName=DNS:%s,DNS:*.%s\nextendedKeyUsage=serverAuth\n' {{ runai_fqdn }} {{ runai_fqdn }} \
      > {{ runai_fqdn }}.ext
    openssl x509 -req -in {{ runai_fqdn }}.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
      -extfile {{ runai_fqdn }}.ext -out {{ runai_fqdn }}.crt
    chmod 0600 {{ runai_fqdn }}.key
  args:
    chdir: "{{ runai_secrets }}"
    creates: "{{ runai_fqdn }}.crt"
  delegate_to: localhost

- name: Read the certificates
  ansible.builtin.slurp:
    src: "{{ runai_secrets }}/{{ item }}"
  loop: ["ca.crt", "{{ runai_fqdn }}.crt", "{{ runai_fqdn }}.key"]
  register: certs
  delegate_to: localhost
  no_log: true

- name: Trust the certificate authority on the controller (runai-api)
  ansible.builtin.copy:
    content: "{{ certs.results[0].content | b64decode }}"
    dest: "{{ runai_ca_path }}"
    mode: "0644"

- name: Store the administrator's password on the controller (runai-api)
  ansible.builtin.copy:
    content: "{{ lookup('file', repo_root ~ '/.secrets/runai-admin.pass') }}\n"
    dest: "{{ runai_admin_password_path }}"
    mode: "0600"
  no_log: true

- name: Install runai-api (the control plane's REST API as its administrator)
  ansible.builtin.template:
    src: runai-api.j2
    dest: /usr/local/sbin/runai-api
    mode: "0755"

# ---- prerequisites ------------------------------------------------------------------

# Run:ai's system services (control plane and cluster) require this label.
# The GPU Operator's mark that a node runs GPU client daemons, NVIDIA's GPU
# fractioning's among them (and evicts them before a driver upgrade).
- name: Let GPU client daemons run on the trays
  ansible.builtin.command: kubectl label node {{ item }} nvidia.com/gpu.deploy.client=true --overwrite
  loop: "{{ groups['workers'] }}"
  register: client_label
  changed_when: "'not labeled' not in client_label.stdout"

- name: Make the controller Run:ai's system node
  ansible.builtin.command: kubectl label node {{ inventory_hostname }} node-role.kubernetes.io/runai-system=true --overwrite
  register: label
  changed_when: "'not labeled' not in label.stdout"

- name: Render Run:ai's namespaces, certificates and the DCGM exporter
  ansible.builtin.template:
    src: objects.yaml.j2
    dest: /etc/rancher/k3s/lab-runai-objects.yaml
    mode: "0600"
  vars:
    files: "{{ dict(certs.results | map(attribute='item') | zip(certs.results | map(attribute='content'))) }}"

# The ClusterPolicy needs its API (in the same file) established first.
- name: Apply them
  ansible.builtin.command: kubectl apply -f /etc/rancher/k3s/lab-runai-objects.yaml
  register: applied
  changed_when: applied.stdout_lines | reject('search', ' unchanged$') | list | length > 0
  until: applied.rc == 0
  retries: 5
  delay: 5

- name: Read the ClusterPolicy's state
  ansible.builtin.command: kubectl get clusterpolicy cluster-policy -o jsonpath={.status.state}
  register: policy_state
  changed_when: false

# What the GPU Operator reports when its operands run.
- name: Report the lab's GPU stack ready
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - clusterpolicy
      - cluster-policy
      - --subresource=status
      - --type=merge
      - -p
      - >-
        {{ {'status': {'state': 'ready', 'conditions': [{'type': 'Ready', 'status': 'True', 'reason': 'Reconciled',
            'message': 'ClusterPolicy is ready', 'lastTransitionTime': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ')}]}}
           | to_json }}
  when: policy_state.stdout != 'ready'

- name: Install the ingress controller and the Prometheus operator
  ansible.builtin.template:
    src: prerequisites.yaml.j2
    dest: "{{ runai_manifests_dir }}/lab-runai-prerequisites.yaml"
    mode: "0600"

- name: Wait for the Prometheus operator's API
  ansible.builtin.command: >-
    kubectl wait --for condition=established --timeout=20s
    crd/prometheuses.monitoring.coreos.com crd/servicemonitors.monitoring.coreos.com
  register: crds
  until: crds.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for the ingress controller, the Prometheus operator and the DCGM exporter
  ansible.builtin.command: kubectl -n {{ item.ns }} rollout status {{ item.kind }} --timeout=300s
  loop:
    - {ns: haproxy-controller, kind: daemonset}
    - {ns: monitoring, kind: deployment}
    - {ns: gpu-operator, kind: daemonset}
  register: rollout
  until: rollout.rc == 0
  retries: 10
  delay: 10
  changed_when: false

# ---- control plane ------------------------------------------------------------------

- name: Install the control plane
  ansible.builtin.template:
    src: control-plane.yaml.j2
    dest: "{{ runai_manifests_dir }}/lab-runai-control-plane.yaml"
    mode: "0600"
  vars:
    runai_admin_password: "{{ lookup('file', repo_root ~ '/.secrets/runai-admin.pass') }}"

# Keycloak's realm and the services behind the API come up last; a fresh
# install takes about 10 minutes, most of it pulling images.
- name: Wait for the control plane's API
  ansible.builtin.command: runai-api GET /v1/k8s/clusters
  register: clusters
  until: clusters.rc == 0
  retries: 120
  delay: 10
  changed_when: false

- name: Register the cluster
  ansible.builtin.command:
    argv: [runai-api, POST, /v1/k8s/clusters, "{{ {'name': runai_cluster_name} | to_json }}"]
  when: runai_cluster_name not in (clusters.stdout | from_json | map(attribute='name'))
  register: created
  until: created.rc == 0
  retries: 18
  delay: 10

- name: Look up the cluster
  ansible.builtin.command: runai-api GET /v1/k8s/clusters
  register: clusters
  changed_when: false

- name: Read the installer's credentials
  ansible.builtin.command: runai-api GET /api/v1/service-accounts/installer
  register: installer
  until: installer.rc == 0 and (installer.stdout | from_json).clientSecret | default('') != ''
  retries: 30
  delay: 5
  changed_when: false
  no_log: true

# ---- cluster ------------------------------------------------------------------------

- name: Install the cluster services
  ansible.builtin.template:
    src: cluster.yaml.j2
    dest: "{{ runai_manifests_dir }}/lab-runai-cluster.yaml"
    mode: "0600"
  vars:
    runai_cluster_uid: >-
      {{ clusters.stdout | from_json | selectattr('name', 'equalto', runai_cluster_name)
         | map(attribute='uuid') | first }}
    runai_client_secret: "{{ (installer.stdout | from_json).clientSecret }}"
  no_log: true

- name: Wait for the cluster to connect
  ansible.builtin.command: runai-api GET /v1/k8s/clusters/{{ uid }}
  vars:
    uid: >-
      {{ clusters.stdout | from_json | selectattr('name', 'equalto', runai_cluster_name)
         | map(attribute='uuid') | first }}
  register: cluster
  until: cluster.rc == 0 and ((cluster.stdout | from_json).status | default({}, true)).state | default('') == 'Connected'
  retries: 90
  delay: 10
  changed_when: false

- name: Run:ai is ready
  ansible.builtin.debug:
    msg: >-
      https://{{ runai_fqdn }} - sign in as {{ runai_admin_email }} with the password in .secrets/runai-admin.pass
      (certificate authority: .secrets/runai/ca.crt)
