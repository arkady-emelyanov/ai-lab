# GPUs for pods on a tray: a CDI specification of the tray's fake GPUs and
# the device plugin (fakedp) that allocates them. Each GPU is one CDI device
# (its /dev/nvidia<n>); every allocation also brings the fake driver, its
# configuration and the tray's sideband and telemetry, as NVIDIA's container
# toolkit brings the real driver.
- name: Read the GPUs
  ansible.builtin.command: nvidia-smi --query-gpu=index,uuid --format=csv,noheader
  register: gpus
  changed_when: false

- name: Read the preload list
  ansible.builtin.slurp:
    src: "{{ fakegpu_prefix }}/lib/fakegpu/preload.list"
  register: preload_list

- name: Create the CDI directory
  ansible.builtin.file:
    path: /etc/cdi
    state: directory
    mode: "0755"

# With Run:ai, the same GPUs also under the names NVIDIA's GPU stack uses:
# the device plugin's (k8s.device-plugin.nvidia.com/gpu=<UUID>, which NVIDIA's
# GPU fractioning gives a container sharing a GPU) and the toolkit's
# management device (management.nvidia.com/gpu=all, for its daemons).
- name: Describe the GPUs to the container runtime (CDI)
  ansible.builtin.template:
    src: fakegpu-cdi.json.j2
    dest: /etc/cdi/{{ item.file }}
    mode: "0644"
  vars:
    gpu_list: "{{ gpus.stdout_lines | map('split', ', ') | list }}"
    preload: "{{ preload_list.content | b64decode | split | join(':') }}"
    cdi_kind: "{{ item.kind }}"
    cdi_all: "{{ item.all }}"
  loop: >-
    {{ [{'file': 'fakegpu.json', 'kind': 'nvidia.com/gpu', 'all': false}]
       + ([{'file': 'nvidia-device-plugin.json', 'kind': 'k8s.device-plugin.nvidia.com/gpu', 'all': false},
           {'file': 'nvidia-management.json', 'kind': 'management.nvidia.com/gpu', 'all': true}]
          if runai | bool else []) }}
  loop_control:
    label: "{{ item.kind }}"
  # containerd reads CDI specifications when it starts: new mounts or env
  # reach pods only after the agent restarts (running pods keep going).
  notify: [Restart fakedp, Restart k3s]

- name: Install the device plugin
  ansible.builtin.copy:
    src: "{{ repo_root }}/fakedp/fakedp"
    dest: /usr/local/sbin/fakedp
    mode: "0755"
  notify: Restart fakedp

- name: Install the device plugin unit
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=GPU device plugin (nvidia.com/gpu, CDI)
      After=k3s-agent.service
      BindsTo=k3s-agent.service

      [Service]
      ExecStart=/usr/local/sbin/fakedp -cdi-spec /etc/cdi/fakegpu.json{{ fakedp_nri_args }}
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=k3s-agent.service
    dest: /etc/systemd/system/fakedp.service
    mode: "0644"
  vars:
    # With Run:ai, also the GPU Operator's NRI plugin (fakedp/nri.go):
    # management devices for NVIDIA's GPU fractioning, in Run:ai's namespace.
    fakedp_nri_args: "{{ ' -nri -management-namespaces runai' if runai | bool else '' }}"
  notify: Restart fakedp

- name: Start the device plugin
  ansible.builtin.systemd_service:
    name: fakedp
    state: started
    enabled: true
    daemon_reload: true

# Large; pulled once here rather than by the first job.
- name: Check for the GPU pod image
  ansible.builtin.command: crictl inspecti {{ k3s_pod_image }}
  register: image
  changed_when: false
  failed_when: false

- name: Pull the GPU pod image
  ansible.builtin.command: crictl pull {{ k3s_pod_image }}
  when: image.rc != 0
