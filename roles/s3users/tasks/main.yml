# Per-user S3 identities on RustFS: one user, one bucket, one policy each
# (the policy allows everything on the user's bucket and nothing else).
- name: Download the RustFS client (rc)
  ansible.builtin.get_url:
    url: "{{ rc_base }}/{{ rc_tarball }}"
    dest: /usr/local/src/{{ rc_tarball }}
    checksum: "sha256:{{ rc_base }}/{{ rc_tarball }}.sha256"
    mode: "0644"

- name: Install rc
  ansible.builtin.unarchive:
    src: /usr/local/src/{{ rc_tarball }}
    dest: /usr/local/bin
    remote_src: true
    include: [rc]

- name: Point rc at RustFS with the admin keys
  ansible.builtin.command: rc alias set lab http://localhost:{{ rustfs_port }} {{ rustfs_access_key }} {{ rustfs_secret_key }}
  changed_when: false
  no_log: true

- name: List S3 users
  ansible.builtin.command: rc admin user list lab/
  register: s3users
  changed_when: false

- name: Create S3 users
  ansible.builtin.command: rc admin user add lab/ {{ item.name }} {{ secret }}
  vars:
    secret: "{{ lookup('ansible.builtin.password', repo_root ~ '/.secrets/users/' ~ item.name ~ '.s3 length=32 chars=ascii_letters,digits') }}"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: s3users.stdout is not search('\\b' ~ item.name ~ '\\b')
  no_log: true

- name: Write per-user bucket policies
  ansible.builtin.copy:
    content: "{{ s3_bucket_policy | to_json }}"
    dest: /etc/rustfs-policy-{{ item.name }}.json
    mode: "0644"
  vars:
    bucket: "{{ item.name }}"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"

# From RustFS' state, not the files: a policy missing, different or not
# attached (rc exits 5 for a policy it does not know) is created or attached.
- name: Read the per-user policies
  ansible.builtin.command: rc admin policy info lab/ {{ item.name }}-own --json
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: user_policies
  changed_when: false
  failed_when: user_policies.rc not in [0, 5]

- name: Create or update per-user policies
  ansible.builtin.command: rc admin policy create lab/ {{ item.item.name }}-own /etc/rustfs-policy-{{ item.item.name }}.json
  vars:
    bucket: "{{ item.item.name }}"
  loop: "{{ user_policies.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0 or (item.stdout | from_json).policy.policy != s3_bucket_policy

- name: Read the users' policies
  ansible.builtin.command: rc admin user info lab/ {{ item.name }} --json
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: user_infos
  changed_when: false

- name: Attach per-user policies
  ansible.builtin.command: rc admin policy attach lab/ {{ item.item.name }}-own --user {{ item.item.name }}
  loop: "{{ user_infos.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.item.name ~ '-own' not in (item.stdout | from_json).policies | default([], true)

- name: List buckets
  ansible.builtin.command: rc ls lab/
  register: buckets
  changed_when: false

- name: Create user buckets
  ansible.builtin.command: rc mb lab/{{ item.name }}
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: buckets.stdout is not search(' ' ~ item.name ~ '/$', multiline=True)

# KubeRay's History Server (k3s mode, kuberay: true): one S3 user for the
# collectors that upload Ray clusters' logs and for the History Server that
# reads them, allowed everything on its bucket and nothing else.
- name: KubeRay History Server storage
  when: scheduler == 'k3s' and kuberay | bool
  vars:
    history_user: ray-history
    bucket: "{{ kuberay_history_bucket }}"
  block:
    - name: Create the History Server's S3 user
      ansible.builtin.command: rc admin user add lab/ {{ history_user }} {{ kuberay_history_secret_key }}
      when: s3users.stdout is not search('\\b' ~ history_user ~ '\\b')
      no_log: true

    - name: Write the History Server's bucket policy
      ansible.builtin.copy:
        content: "{{ s3_bucket_policy | to_json }}"
        dest: /etc/rustfs-policy-{{ history_user }}.json
        mode: "0644"

    - name: Read the History Server's policy
      ansible.builtin.command: rc admin policy info lab/ {{ history_user }}-own --json
      register: history_policy
      changed_when: false
      failed_when: history_policy.rc not in [0, 5]

    - name: Create or update the History Server's policy
      ansible.builtin.command: rc admin policy create lab/ {{ history_user }}-own /etc/rustfs-policy-{{ history_user }}.json
      when: history_policy.rc != 0 or (history_policy.stdout | from_json).policy.policy != s3_bucket_policy

    - name: Read the History Server's user
      ansible.builtin.command: rc admin user info lab/ {{ history_user }} --json
      register: history_user_info
      changed_when: false

    - name: Attach the History Server's policy
      ansible.builtin.command: rc admin policy attach lab/ {{ history_user }}-own --user {{ history_user }}
      when: history_user ~ '-own' not in (history_user_info.stdout | from_json).policies | default([], true)

    - name: Create the History Server's bucket
      ansible.builtin.command: rc mb lab/{{ kuberay_history_bucket }}
      when: buckets.stdout is not search(' ' ~ kuberay_history_bucket ~ '/$', multiline=True)
