# Per-user S3 identities on RustFS: one user, one bucket, one policy each
# (the policy allows everything on the user's bucket and nothing else).
- name: Download the RustFS client (rc)
  ansible.builtin.get_url:
    url: "{{ rc_base }}/{{ rc_tarball }}"
    dest: /usr/local/src/{{ rc_tarball }}
    checksum: "sha256:{{ rc_base }}/{{ rc_tarball }}.sha256"
    mode: "0644"

- name: Install rc
  ansible.builtin.unarchive:
    src: /usr/local/src/{{ rc_tarball }}
    dest: /usr/local/bin
    remote_src: true
    include: [rc]

- name: Point rc at RustFS with the admin keys
  ansible.builtin.command: rc alias set lab http://localhost:{{ rustfs_port }} {{ rustfs_access_key }} {{ rustfs_secret_key }}
  changed_when: false
  no_log: true

- name: List S3 users
  ansible.builtin.command: rc admin user list lab/
  register: s3users
  changed_when: false

- name: Create S3 users
  ansible.builtin.command: rc admin user add lab/ {{ item.name }} {{ secret }}
  vars:
    secret: "{{ lookup('ansible.builtin.password', repo_root ~ '/.secrets/users/' ~ item.name ~ '.s3 length=32 chars=ascii_letters,digits') }}"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: s3users.stdout is not search('\\b' ~ item.name ~ '\\b')
  no_log: true

- name: Write per-user bucket policies
  ansible.builtin.copy:
    content: "{{ s3_bucket_policy | to_json }}"
    dest: /etc/rustfs-policy-{{ item.name }}.json
    mode: "0644"
  vars:
    bucket: "{{ item.name }}"
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"

# From RustFS' state, not the files: a policy missing, different or not
# attached (rc exits 5 for a policy it does not know) is created or attached.
- name: Read the per-user policies
  ansible.builtin.command: rc admin policy info lab/ {{ item.name }}-own --json
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: user_policies
  changed_when: false
  failed_when: user_policies.rc not in [0, 5]

- name: Create or update per-user policies
  ansible.builtin.command: rc admin policy create lab/ {{ item.item.name }}-own /etc/rustfs-policy-{{ item.item.name }}.json
  vars:
    bucket: "{{ item.item.name }}"
  loop: "{{ user_policies.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.rc != 0 or (item.stdout | from_json).policy.policy != s3_bucket_policy

- name: Read the users' policies
  ansible.builtin.command: rc admin user info lab/ {{ item.name }} --json
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: user_infos
  changed_when: false

- name: Attach per-user policies
  ansible.builtin.command: rc admin policy attach lab/ {{ item.item.name }}-own --user {{ item.item.name }}
  loop: "{{ user_infos.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.item.name ~ '-own' not in (item.stdout | from_json).policies | default([], true)

- name: List buckets
  ansible.builtin.command: rc ls lab/
  register: buckets
  changed_when: false

- name: Create user buckets
  ansible.builtin.command: rc mb lab/{{ item.name }}
  loop: "{{ cluster_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: buckets.stdout is not search(' ' ~ item.name ~ '/$', multiline=True)

# S3 users of services, each allowed everything on its own bucket and
# nothing else: KubeRay's History Server (k3s mode, kuberay: true), for the
# collectors that upload Ray clusters' logs and the History Server that
# reads them, and clients on the host (s3_service_users). Secret keys in
# .secrets/<name>.s3.
- name: Service S3 users
  ansible.builtin.include_tasks: service-user.yml
  loop: >-
    {{ ([{'name': 'ray-history', 'bucket': kuberay_history_bucket}] if scheduler == 'k3s' and kuberay | bool else [])
       + s3_service_users | map('community.general.dict_kv', 'name') | list }}
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
