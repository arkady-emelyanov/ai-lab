# topograph (dsx-ai-factory/topograph) on the controller: discovers the
# InfiniBand fabric (ibnetdiscover) and NVLink domains (nvidia-smi) on the
# trays through pdsh, and generates Slurm's topology.conf. Built on the host
# by `make init`.
- name: Install pdsh
  ansible.builtin.apt:
    name: pdsh

# pdsh reaches the trays as root with the controller's key from `make init`.
- name: Install the controller's SSH key for pdsh
  ansible.builtin.copy:
    src: "{{ repo_root }}/.secrets/ssh/{{ item.src }}"
    dest: /root/.ssh/{{ item.dest }}
    mode: "{{ item.mode }}"
  loop:
    - { src: controller_ed25519, dest: id_ed25519, mode: "0600" }
    - { src: controller_ed25519.pub, dest: id_ed25519.pub, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"

- name: Trust lab hosts on first contact
  ansible.builtin.copy:
    content: |
      Host {{ groups['workers'] | join(' ') }}
          StrictHostKeyChecking accept-new
          BatchMode yes
    dest: /root/.ssh/config
    mode: "0600"

- name: Authorise the controller key for root on the trays
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('file', repo_root ~ '/.secrets/ssh/controller_ed25519.pub') }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['workers'] }}"
  run_once: true

- name: Install topograph
  ansible.builtin.copy:
    src: "{{ repo_root }}/.cache/topograph/topograph"
    dest: /usr/local/bin/topograph
    mode: "0755"
  notify: Restart topograph

- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/topograph
    state: directory
    mode: "0755"

- name: Configure topograph
  ansible.builtin.template:
    src: topograph-config.yaml.j2
    dest: /etc/topograph/topograph-config.yaml
    mode: "0644"
  notify: Restart topograph

# k3s: topograph's Kubernetes engine labels nodes through the API with
# in-cluster credentials (rest.InClusterConfig: service address in the
# environment, token and CA at the service account path). It runs here, not
# in a pod, so pdsh reaches the trays' ibnetdiscover and nvidia-smi as in
# Slurm mode; the unit stages a service account token where it looks.
- name: Kubernetes access for topograph (k3s)
  when: scheduler == 'k3s'
  block:
    - name: Create topograph's service account and token
      ansible.builtin.command: kubectl apply -f -
      args:
        stdin: |
          apiVersion: v1
          kind: ServiceAccount
          metadata: {name: topograph, namespace: kube-system}
          ---
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/service-account-token
          metadata:
            name: topograph-token
            namespace: kube-system
            annotations: {kubernetes.io/service-account.name: topograph}
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata: {name: topograph}
          rules:
            - apiGroups: [""]
              resources: [nodes]
              verbs: [get, list, watch, patch, update]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata: {name: topograph}
          roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: topograph}
          subjects: [{kind: ServiceAccount, name: topograph, namespace: kube-system}]
      register: sa
      changed_when: sa.stdout_lines | reject('search', ' unchanged$') | list | length > 0

    - name: Read the token
      ansible.builtin.command: kubectl -n kube-system get secret topograph-token -o jsonpath={.data.token}
      register: token
      until: token.stdout != ''
      retries: 10
      delay: 2
      changed_when: false
      no_log: true

    - name: Create the credentials directory
      ansible.builtin.file:
        path: /etc/topograph/serviceaccount
        state: directory
        mode: "0700"

    - name: Store the token and the cluster CA
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: /etc/topograph/serviceaccount/{{ item.name }}
        mode: "0600"
      loop:
        - {name: token, content: "{{ token.stdout | b64decode }}"}
        - {name: namespace, content: kube-system}
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      notify: Restart topograph

    - name: Store the cluster CA
      ansible.builtin.copy:
        src: /var/lib/rancher/k3s/server/tls/server-ca.crt
        dest: /etc/topograph/serviceaccount/ca.crt
        remote_src: true
        mode: "0644"
      notify: Restart topograph

- name: Install the topograph unit
  ansible.builtin.template:
    src: topograph.service.j2
    dest: /etc/systemd/system/topograph.service
    mode: "0644"
  notify: Restart topograph

- name: Install update-topology
  ansible.builtin.template:
    src: update-topology.j2
    dest: /usr/local/sbin/update-topology
    mode: "0755"

- name: Start topograph
  ansible.builtin.systemd_service:
    name: topograph
    state: started
    enabled: true
    daemon_reload: true

# Partition and fabric changes reach the scheduler within a minute (Slurm's
# topology.conf, or node labels for Kueue); an unchanged topology is left
# alone.
- name: Install the topology refresh timer
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: /etc/systemd/system/{{ item.name }}
    mode: "0644"
  loop:
    - name: update-topology.service
      content: |
        [Unit]
        Description=Regenerate the scheduler's topology with topograph
        After=topograph.service
        Requires=topograph.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/update-topology
    - name: update-topology.timer
      content: |
        [Unit]
        Description=Regenerate the scheduler's topology every minute

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=1min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"

- name: Enable the topology refresh timer
  ansible.builtin.systemd_service:
    name: update-topology.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Apply changes
  ansible.builtin.meta: flush_handlers

- name: Wait for topograph
  ansible.builtin.uri:
    url: http://localhost:{{ topograph_port }}/healthz
  register: health
  retries: 15
  delay: 2
  until: health.status == 200
