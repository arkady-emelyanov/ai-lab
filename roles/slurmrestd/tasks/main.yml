# Slurm's REST API on the controller (slurmrestd), authenticating requests by
# JSON Web Token (rest_auth/jwt): a client sends X-SLURM-USER-NAME and
# X-SLURM-USER-TOKEN, the token from `scontrol token`. slurmrestd refuses to
# run as root or as SlurmUser: it runs as a user of its own.
- name: Install slurmrestd
  ansible.builtin.apt:
    name: slurmrestd

- name: Create the slurmrestd user
  ansible.builtin.user:
    name: slurmrestd
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false

- name: Create the drop-in directory for its unit
  ansible.builtin.file:
    path: /etc/systemd/system/slurmrestd.service.d
    state: directory
    mode: "0755"

# Ubuntu's unit runs it as root on a UNIX socket in /run and on the port;
# here it runs as slurmrestd, on the port only, with JWT authentication,
# serving slurmctld's and slurmdbd's endpoints (/slurm/v0.0.40/...,
# /slurmdb/v0.0.40/...) with Slurm 23.11's newest data parser.
- name: Run slurmrestd as its own user with JWT authentication
  ansible.builtin.copy:
    content: |
      [Service]
      User=slurmrestd
      Group=slurmrestd
      ExecStart=
      ExecStart=/usr/sbin/slurmrestd -a rest_auth/jwt -s openapi/slurmctld,openapi/slurmdbd -d data_parser/v0.0.40 0.0.0.0:{{ slurmrestd_port }}
    dest: /etc/systemd/system/slurmrestd.service.d/lab.conf
    mode: "0644"
  notify: Restart slurmrestd

- name: Start slurmrestd
  ansible.builtin.systemd_service:
    name: slurmrestd
    state: started
    enabled: true
    daemon_reload: true

- name: Apply changes
  ansible.builtin.meta: flush_handlers

- name: Wait for the REST API
  ansible.builtin.wait_for:
    port: "{{ slurmrestd_port }}"
    timeout: 30

# For clients on the host (job portals, schedulers): a token of SlurmUser,
# which may act for any user (X-SLURM-USER-NAME), in .secrets/slurm-jwt. A
# new one when it is missing or no longer accepted (expired, or a new key).
- name: Check the service token
  ansible.builtin.uri:
    url: http://localhost:{{ slurmrestd_port }}/slurm/v0.0.40/ping
    headers:
      X-SLURM-USER-NAME: slurm
      X-SLURM-USER-TOKEN: "{{ lookup('ansible.builtin.file', token_file, errors='ignore') | default('', true) }}"
    status_code: [200, 401, 500]  # 500: a token it cannot decode
  register: token_check
  vars:
    token_file: "{{ repo_root }}/.secrets/slurm-jwt"
  no_log: true

- name: Make a service token
  ansible.builtin.command: scontrol token username=slurm lifespan={{ slurm_service_token_days * 86400 }}
  register: service_token
  when: token_check.status != 200
  changed_when: true
  no_log: true

- name: Save it for the host
  ansible.builtin.copy:
    content: "{{ service_token.stdout.split('=', 1)[1] }}\n"
    dest: "{{ repo_root }}/.secrets/slurm-jwt"
    mode: "0600"
  delegate_to: localhost
  when: service_token is changed
  no_log: true
