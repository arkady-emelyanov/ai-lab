# Grafana on the controller: Prometheus as the default datasource and
# provisioned dashboards (GPU exporter, node exporter, lab overview, scheduler & fabric).
- name: Add the Grafana APT key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: Add the Grafana repository
  ansible.builtin.deb822_repository:
    name: grafana
    types: deb
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: /etc/apt/keyrings/grafana.asc
  register: grafana_repo

# Written by the former one-line repository definition.
- name: Remove the old repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/grafana.list
    state: absent

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    update_cache: "{{ grafana_repo.changed }}"

- name: Provision the Prometheus datasource
  ansible.builtin.copy:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://localhost:9090
          access: proxy
          isDefault: true
    dest: /etc/grafana/provisioning/datasources/prometheus.yaml
    mode: "0644"
  notify: Restart grafana

- name: Provision dashboards from a directory
  ansible.builtin.copy:
    content: |
      apiVersion: 1
      providers:
        - name: lab
          folder: Lab
          type: file
          options:
            path: /var/lib/grafana/dashboards
    dest: /etc/grafana/provisioning/dashboards/lab.yaml
    mode: "0644"
  notify: Restart grafana

- name: Create the dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Download published dashboards
  ansible.builtin.get_url:
    url: https://grafana.com/api/dashboards/{{ item.id }}/revisions/{{ item.revision }}/download
    dest: /var/lib/grafana/dashboards/{{ item.file }}
    owner: grafana
    group: grafana
    mode: "0644"
  loop: "{{ grafana_dashboards }}"
  loop_control:
    label: "{{ item.file }}"

- name: Install the lab dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /var/lib/grafana/dashboards/{{ item }}
    owner: grafana
    group: grafana
    mode: "0644"
  loop: [lab-overview.json, sched-fabric.json]

# KubeRay (k3s mode): Ray's own Grafana dashboards, which Ray's dashboard
# embeds panels of. Embedding needs Grafana to allow it, and to show the
# panels without a login: anonymous viewers (read-only), as Ray documents.
- name: Ray's dashboards in Grafana
  when: scheduler == 'k3s' and kuberay | bool
  block:
    - name: Create the drop-in directory for Grafana's unit
      ansible.builtin.file:
        path: /etc/systemd/system/grafana-server.service.d
        state: directory
        mode: "0755"

    - name: Allow embedding and anonymous viewers
      ansible.builtin.copy:
        content: |
          [Service]
          Environment=GF_SECURITY_ALLOW_EMBEDDING=true
          Environment=GF_AUTH_ANONYMOUS_ENABLED=true
          Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
        dest: /etc/systemd/system/grafana-server.service.d/ray.conf
        mode: "0644"
      notify: Restart grafana

    - name: Create the Ray dashboards directory
      ansible.builtin.file:
        path: /var/lib/grafana/dashboards-ray
        state: directory
        owner: grafana
        group: grafana
        mode: "0755"

    - name: Provision Ray's dashboards (folder Ray)
      ansible.builtin.copy:
        content: |
          apiVersion: 1
          providers:
            - name: ray
              folder: Ray
              type: file
              options:
                path: /var/lib/grafana/dashboards-ray
        dest: /etc/grafana/provisioning/dashboards/ray.yaml
        mode: "0644"
      notify: Restart grafana

    # Ray writes them for its version at start; the kuberay role's Ray (Ray's
    # dashboard for finished clusters) has the venv's version.
    - name: List the dashboards Ray generated
      ansible.builtin.command: >-
        kubectl -n kuberay exec deploy/ray-history --
        ls /tmp/ray/session_latest/metrics/grafana/dashboards
      register: ray_dashboards
      changed_when: false

    - name: Install them
      ansible.builtin.shell: |
        set -eo pipefail
        dest=/var/lib/grafana/dashboards-ray/{{ item }}
        kubectl -n kuberay exec deploy/ray-history -- \
            cat /tmp/ray/session_latest/metrics/grafana/dashboards/{{ item }} > $dest.new
        if cmp -s $dest.new $dest; then rm $dest.new; else
            chown grafana:grafana $dest.new && chmod 0644 $dest.new && mv $dest.new $dest && echo installed
        fi
      args:
        executable: /bin/bash
      loop: "{{ ray_dashboards.stdout_lines | select('match', '.*\\.json$') | list }}"
      register: ray_dashboard_install
      changed_when: "'installed' in ray_dashboard_install.stdout"

- name: No Ray settings without KubeRay
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/grafana-server.service.d/ray.conf
    - /etc/grafana/provisioning/dashboards/ray.yaml
  when: not (scheduler == 'k3s' and kuberay | bool)
  notify: Restart grafana

- name: Start Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    state: started
    enabled: true

- name: Apply changes
  ansible.builtin.meta: flush_handlers

- name: Wait for Grafana
  ansible.builtin.uri:
    url: http://localhost:{{ grafana_port }}/api/health
  register: health
  retries: 30
  delay: 2
  until: health.status == 200

- name: Set the admin password
  ansible.builtin.command: grafana cli --homepath /usr/share/grafana admin reset-admin-password {{ grafana_admin_password }}
  changed_when: false
  no_log: true
