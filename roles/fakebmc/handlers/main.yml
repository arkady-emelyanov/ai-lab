- name: Restart fakebmc
  ansible.builtin.systemd_service:
    name: fakebmc
    state: restarted
    daemon_reload: true

# The exporter discovers each BMC's resources once, at its first scrape; after
# a BMC upgrade (as after a firmware update) it must look again.
- name: Restart the Redfish exporter
  ansible.builtin.command: systemctl try-restart redfish-exporter.service
  delegate_to: "{{ groups['controller'][0] }}"
  run_once: true
  register: redfish_restart
  failed_when: redfish_restart.rc not in [0, 5]  # 5: not installed yet
  changed_when: redfish_restart.rc == 0
