# Emulated NVIDIA userspace for a GPU tray. /dev/nvidia* device nodes are
# created by Incus at provision time (containers may not mknod).
- name: Install build tools
  ansible.builtin.apt:
    name: [build-essential, python3]

- name: Create the source directory
  ansible.builtin.file:
    path: /usr/local/src/fakegpu/symbols
    state: directory
    mode: "0755"

# Sources only: build outputs and editor/tool state in the checkout would
# otherwise force a rebuild on every run.
- name: Copy fakegpu sources
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/src/fakegpu/{{ item | relpath(repo_root ~ '/fakegpu') }}
    mode: preserve
  loop: >-
    {{ query('fileglob', repo_root ~ '/fakegpu/*.[ch]')
       + query('fileglob', repo_root ~ '/fakegpu/symbols/*.syms')
       + [repo_root ~ '/fakegpu/Makefile', repo_root ~ '/fakegpu/nvidia-smi',
          repo_root ~ '/fakegpu/numactl'] }}
  loop_control:
    label: "{{ item | relpath(repo_root ~ '/fakegpu') }}"
  register: fakegpu_src

- name: Build and install fakegpu
  ansible.builtin.shell: make clean && make -j4 && make install PREFIX={{ fakegpu_prefix }}
  args:
    chdir: /usr/local/src/fakegpu
  when: fakegpu_src.changed
  notify: Restart fakegpu users

# Every CUDA process creates/updates the occupancy file here, and puts GPU
# memory it shares through CUDA IPC in the IPC directory.
- name: Make the telemetry and CUDA IPC directories writable by all users
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "1777"
  loop:
    - "{{ telemetry_tray_path }}"
    - "{{ fakegpu_ipc_dir }}"

# On the shared volume: every rank of a job (Slurm or pod) writes its NVLink
# partition here when NCCL creates a communicator, and GPU memory shared as
# fabric handles lives in the fabric directory.
- name: Create the NCCL topology exchange and fabric memory directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ fakegpu_nccl_dir | dirname }}", mode: "0755" }
    - { path: "{{ fakegpu_nccl_dir }}", mode: "1777" }
    - { path: "{{ fakegpu_fabric_dir }}", mode: "1777" }
  run_once: true

# Processes read it once: the GPU exporter and GFD restart when it changes
# (e.g. new driver or CUDA versions); jobs pick it up when they next start.
- name: Configure the emulated tray
  ansible.builtin.template:
    src: fakegpu.conf.j2
    dest: /etc/fakegpu.conf
    mode: "0644"
  notify: Restart fakegpu users

- name: Put the fake driver on the linker path
  ansible.builtin.copy:
    content: "{{ fakegpu_prefix }}/lib/fakegpu\n"
    dest: /etc/ld.so.conf.d/00-fakegpu.conf
    mode: "0644"
  register: ldconf

- name: Refresh the linker cache
  ansible.builtin.command: ldconfig
  when: ldconf.changed or fakegpu_src.changed

# Framework wheels (torch, jax, ...) bundle cuBLAS/NCCL/cuDNN and load them
# through RPATH; preloading stubs with the same SONAMEs makes every process
# bind to the stubs instead.
- name: Read the preload list
  ansible.builtin.slurp:
    src: "{{ fakegpu_prefix }}/lib/fakegpu/preload.list"
  register: preload_list

- name: Preload the CUDA library stubs in every process
  ansible.builtin.copy:
    content: "{{ preload_list.content | b64decode }}"
    dest: /etc/ld.so.preload
    mode: "0644"

# A node reboot loads the driver and resets its GPUs: MIG instances are gone
# (MIG mode stays), and pending NVLink partition changes take effect (the
# GPU takes its partition's clique at a reset). Enabled for the next boot
# only: a reset now would hit running jobs.
- name: Reset the GPUs at boot
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Load the driver and reset the GPUs at boot (MIG instances go, pending NVLink partition changes take effect)
      Before=slurmd.service k3s-agent.service fakedp.service nvidia_gpu_exporter.service

      [Service]
      Type=oneshot
      ExecStart={{ fakegpu_prefix }}/bin/nvidia-smi --fakegpu-driver-load
      ExecStart={{ fakegpu_prefix }}/bin/nvidia-smi --gpu-reset
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/fakegpu-boot-reset.service
    mode: "0644"

- name: Enable the boot reset
  ansible.builtin.systemd_service:
    name: fakegpu-boot-reset
    enabled: true
    daemon_reload: true

# ---- driver root for NVIDIA's DRA driver (k3s, nvidia_dra) ---------------------
# The fake driver laid out as NVIDIA's driver is on a host, in a directory of
# its own (fakegpu_driver_root) that NVIDIA's DRA driver mounts at
# /driver-root: the libraries under the driver version's names (its CDI
# specifications need them; relative links only, resolved in its container),
# nvidia-smi (--version, its check of a driver root), nvidia-imex and
# nvidia-imex-ctl (its compute-domain daemons run them), /proc entries in
# place of the host's (devices, the IMEX management capability), and the
# tray's GPU state (partition, reset cliques) for the fake NVML there.
- name: Driver root for NVIDIA's DRA driver
  when: scheduler == 'k3s' and nvidia_dra | bool
  vars:
    root: "{{ fakegpu_driver_root }}"
    libdir: "{{ fakegpu_driver_root }}/usr/lib/x86_64-linux-gnu"
  block:
    - name: Create the driver root's directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ libdir }}"
        - "{{ root }}/usr/bin"
        - "{{ root }}/etc"
        - "{{ root }}/proc/driver/nvidia/capabilities"
        - "{{ root }}/var/lib/fakegpu"

    - name: Install the driver libraries under the driver version's names
      ansible.builtin.copy:
        src: "{{ fakegpu_prefix }}/lib/fakegpu/{{ item }}.so.1"
        dest: "{{ libdir }}/{{ item }}.so.{{ fakegpu_driver_version }}"
        remote_src: true
        mode: "0755"
      loop: [libnvidia-ml, libcuda]

    - name: Link them by their SONAMEs
      ansible.builtin.file:
        src: "{{ item }}.so.{{ fakegpu_driver_version }}"
        dest: "{{ libdir }}/{{ item }}.so.1"
        state: link
        force: true
      loop: [libnvidia-ml, libcuda]

    - name: Install nvidia-smi, nvidia-imex and nvidia-imex-ctl
      ansible.builtin.copy:
        src: "{{ fakegpu_prefix }}/lib/fakegpu/driver-tools/{{ item }}"
        dest: "{{ root }}/usr/bin/{{ item }}"
        remote_src: true
        mode: "0755"
      loop: [nvidia-smi, nvidia-imex, nvidia-imex-ctl]

    - name: Copy the emulated tray's configuration
      ansible.builtin.copy:
        src: /etc/fakegpu.conf
        dest: "{{ root }}/etc/fakegpu.conf"
        remote_src: true
        mode: "0644"

    # NVIDIA's DRA driver takes it in place of /proc/devices (altProcDevices).
    - name: Write the driver's device numbers
      ansible.builtin.copy:
        content: |
          Character devices:
          195 nvidia-frontend
          {{ fakegpu_caps_major }} nvidia-caps
          {{ fakegpu_imex_channels_major }} nvidia-caps-imex-channels

          Block devices:
            7 loop
            8 sd
          259 blkext
        dest: "{{ root }}/proc/devices"
        mode: "0444"

    - name: Write the IMEX management capability
      ansible.builtin.copy:
        content: |
          DeviceFileMinor: {{ fakegpu_imex_mgmt_minor }}
          DeviceFileMode: 256
          DeviceFileModify: 1
        dest: "{{ root }}/proc/driver/nvidia/capabilities/fabric-imex-mgmt"
        mode: "0444"

    - name: Mount the GPUs' state in the driver root
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=The emulated GPUs' state in the fake driver root (NVIDIA's DRA driver)
          RequiresMountsFor=/var/lib/fakegpu/sideband /var/lib/fakegpu/telemetry

          [Mount]
          What=/var/lib/fakegpu
          Where={{ root }}/var/lib/fakegpu
          Type=none
          Options=rbind

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/{{ (root ~ '/var/lib/fakegpu') | regex_replace('^/', '') | replace('-', '\\x2d') | replace('/', '-') }}.mount
        mode: "0644"
      register: state_mount

    - name: Start the mount
      ansible.builtin.systemd_service:
        name: "{{ (root ~ '/var/lib/fakegpu') | regex_replace('^/', '') | replace('-', '\\x2d') | replace('/', '-') }}.mount"
        state: started
        enabled: true
        daemon_reload: "{{ state_mount.changed }}"

- name: Check the fake GPUs are visible
  ansible.builtin.command: nvidia-smi -L
  register: smi
  changed_when: false
  failed_when: smi.stdout_lines | length != fakegpu_count
