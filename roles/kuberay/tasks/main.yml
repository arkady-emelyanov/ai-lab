# KubeRay on the k3s cluster (kuberay: true), from the controller: the
# operator and the API server from KubeRay's charts, the dashboard, one
# plain-HTTP ingress for the dashboard and the API server, and the History
# Server on the RustFS bucket (S3 user: s3users role). See docs/kuberay.md.

- name: Look up the bridge network
  ansible.builtin.command: incus network get {{ incus_bridge }} ipv4.address
  register: bridge
  delegate_to: localhost
  changed_when: false

- name: Work out the dashboards' names
  ansible.builtin.set_fact:
    kuberay_controller_address: "{{ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host }}"
    kuberay_fqdn: >-
      {{ 'kuberay.' ~ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host ~ '.nip.io'
         if kuberay_domain == 'auto' else kuberay_domain }}
    kuberay_history_fqdn: >-
      {{ 'ray-history.' ~ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host ~ '.nip.io'
         if kuberay_history_domain == 'auto' else kuberay_history_domain }}

- name: Install KubeRay
  ansible.builtin.template:
    src: kuberay.yaml.j2
    dest: "{{ kuberay_manifests_dir }}/lab-kuberay.yaml"
    mode: "0600"
  diff: false

- name: Wait for KubeRay's APIs
  ansible.builtin.command: >-
    kubectl wait --for condition=established --timeout=20s
    crd/rayclusters.ray.io crd/rayjobs.ray.io crd/rayservices.ray.io
  register: crds
  until: crds.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for the operator, the API server, the dashboards and the History Server
  ansible.builtin.command: kubectl -n {{ kuberay_namespace }} rollout status deployment/{{ item }} --timeout=300s
  loop: [kuberay-operator, kuberay-apiserver, kuberay-dashboard, historyserver, ray-history]
  register: rollout
  until: rollout.rc == 0
  retries: 10
  delay: 10
  changed_when: false

# With Run:ai, Ray clusters in a project's namespace are Run:ai workloads,
# scheduled by KAI (Run:ai knows RayCluster, RayJob and RayService). The
# History Server's keys reach every project namespace as a cluster-wide
# Run:ai credentials asset, which Run:ai turns into the Secret
# genericsecret-ray-history-s3 there.
- name: The History Server's keys for Run:ai projects
  when: runai | bool
  block:
    - name: Look up the Run:ai cluster and its credentials
      ansible.builtin.shell: |
        set -eo pipefail
        runai-api GET /v1/k8s/clusters | jq -r '.[] | select(.name == "{{ runai_cluster_name }}") | .uuid'
        runai-api GET /api/v1/asset/credentials/generic-secret | jq -r '.entries[].meta.name'
      args:
        executable: /bin/bash
      register: runai_credentials
      changed_when: false

    - name: Create the credentials asset ray-history-s3
      ansible.builtin.command:
        argv:
          - runai-api
          - POST
          - /api/v1/asset/credentials/generic-secret
          - >-
            {{ {'meta': {'name': 'ray-history-s3', 'scope': 'cluster', 'clusterId': runai_credentials.stdout_lines[0]},
                'spec': {'keyValuePairs': [
                  {'key': 'STORAGE_BACKEND', 'value': 's3'},
                  {'key': 'S3_ENDPOINT', 'value': storage_host ~ ':' ~ rustfs_port},
                  {'key': 'S3DISABLE_SSL', 'value': 'true'},
                  {'key': 'S3FORCE_PATH_STYLE', 'value': 'true'},
                  {'key': 'S3_REGION', 'value': 'us-east-1'},
                  {'key': 'S3_BUCKET', 'value': kuberay_history_bucket},
                  {'key': 'AWS_ACCESS_KEY_ID', 'value': 'ray-history'},
                  {'key': 'AWS_SECRET_ACCESS_KEY', 'value': kuberay_history_secret_key}]}} | to_json }}
      when: "'ray-history-s3' not in runai_credentials.stdout_lines[1:]"
      no_log: true

- name: KubeRay is ready
  ansible.builtin.debug:
    msg: >-
      http://{{ kuberay_fqdn }} - KubeRay dashboard (Ray jobs and clusters);
      http://{{ kuberay_history_fqdn }} - Ray's dashboard for finished clusters
