# KubeRay on the k3s cluster (kuberay: true), from the controller: the
# operator and the API server from KubeRay's charts, the dashboard, one
# plain-HTTP ingress for the dashboard and the API server, and the History
# Server on the RustFS bucket (S3 user: s3users role). See docs/kuberay.md.

- name: Look up the bridge network
  ansible.builtin.command: incus network get {{ incus_bridge }} ipv4.address
  register: bridge
  delegate_to: localhost
  changed_when: false

- name: Work out the dashboards' names
  ansible.builtin.set_fact:
    kuberay_controller_address: "{{ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host }}"
    kuberay_fqdn: >-
      {{ 'kuberay.' ~ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host ~ '.nip.io'
         if kuberay_domain == 'auto' else kuberay_domain }}
    kuberay_history_fqdn: >-
      {{ 'ray-history.' ~ bridge.stdout.split('/')[0].rsplit('.', 1)[0] ~ '.' ~ ip_host ~ '.nip.io'
         if kuberay_history_domain == 'auto' else kuberay_history_domain }}

- name: Install KubeRay
  ansible.builtin.template:
    src: kuberay.yaml.j2
    dest: "{{ kuberay_manifests_dir }}/lab-kuberay.yaml"
    mode: "0600"
  diff: false

- name: Wait for KubeRay's APIs
  ansible.builtin.command: >-
    kubectl wait --for condition=established --timeout=20s
    crd/rayclusters.ray.io crd/rayjobs.ray.io crd/rayservices.ray.io
  register: crds
  until: crds.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for the operator, the API server, the dashboards and the History Server
  ansible.builtin.command: kubectl -n {{ kuberay_namespace }} rollout status deployment/{{ item }} --timeout=300s
  loop: [kuberay-operator, kuberay-apiserver, kuberay-dashboard, historyserver, ray-history]
  register: rollout
  until: rollout.rc == 0
  retries: 10
  delay: 10
  changed_when: false

# With Run:ai, Ray clusters in a project's namespace are Run:ai workloads,
# scheduled by KAI (Run:ai knows RayCluster, RayJob and RayService). The
# History Server's keys reach every project namespace as a cluster-wide
# Run:ai credentials asset, which Run:ai turns into the Secret
# genericsecret-ray-history-s3 there.
- name: The History Server's keys for Run:ai projects
  when: runai | bool
  vars:
    ray_history_s3:
      STORAGE_BACKEND: s3
      S3_ENDPOINT: "{{ storage_host }}:{{ rustfs_port }}"
      S3DISABLE_SSL: "true"
      S3FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: "{{ kuberay_history_bucket }}"
      AWS_ACCESS_KEY_ID: ray-history
      AWS_SECRET_ACCESS_KEY: "{{ kuberay_history_secret_key }}"
    runai_cluster_uuid: >-
      {{ runai_clusters.stdout | from_json | selectattr('name', 'equalto', runai_cluster_name)
         | map(attribute='uuid') | first | default('') }}
    ray_history_asset_id: >-
      {{ (runai_credentials.stdout | from_json).entries
         | selectattr('meta.name', 'equalto', 'ray-history-s3') | selectattr('meta.scope', 'equalto', 'cluster')
         | selectattr('meta.clusterId', 'equalto', runai_cluster_uuid) | map(attribute='meta.id') | first | default('') }}
    ray_history_asset_body: >-
      {{ {'meta': {'name': 'ray-history-s3', 'scope': 'cluster', 'clusterId': runai_cluster_uuid},
          'spec': {'keyValuePairs': ray_history_s3 | dict2items(key_name='key', value_name='value')}} | to_json }}
  block:
    - name: Look up the Run:ai cluster
      ansible.builtin.command: runai-api GET /v1/k8s/clusters
      register: runai_clusters
      changed_when: false

    - name: The Run:ai cluster is registered
      ansible.builtin.assert:
        that: runai_cluster_uuid != ''
        fail_msg: Run:ai has no cluster {{ runai_cluster_name }} (the runai role registers it)
        quiet: true

    - name: Look up the credentials assets
      ansible.builtin.command: runai-api GET /api/v1/asset/credentials/generic-secret
      register: runai_credentials
      changed_when: false

    # Run:ai's API masks the asset's keys and cannot change them: compare
    # the Secret it made in its namespace, and replace the asset if it differs.
    - name: Read the keys Run:ai distributes
      ansible.builtin.shell: |
        set -eo pipefail
        kubectl -n runai get secret genericsecret-ray-history-s3 --ignore-not-found -o json \
            | jq -c '.data // {} | map_values(@base64d)'
      args:
        executable: /bin/bash
      register: ray_history_secret
      when: ray_history_asset_id != ''
      changed_when: false
      no_log: true

    - name: Delete the credentials asset ray-history-s3 with outdated keys
      ansible.builtin.command: runai-api DELETE /api/v1/asset/credentials/generic-secret/{{ ray_history_asset_id }}
      register: ray_history_deleted
      when:
        - ray_history_asset_id != ''
        - ray_history_secret.stdout not in ['', '{}']
        - ray_history_secret.stdout | from_json != ray_history_s3
      no_log: true

    - name: Create the credentials asset ray-history-s3
      ansible.builtin.command:
        argv: [runai-api, POST, /api/v1/asset/credentials/generic-secret, "{{ ray_history_asset_body }}"]
      when: ray_history_asset_id == '' or ray_history_deleted is changed
      no_log: true

- name: KubeRay is ready
  ansible.builtin.debug:
    msg: >-
      http://{{ kuberay_fqdn }} - KubeRay dashboard (Ray jobs and clusters);
      http://{{ kuberay_history_fqdn }} - Ray's dashboard for finished clusters
