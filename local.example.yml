# Local settings for this checkout: make init copies this file to
# local.yml (not in git), and every make target passes that to
# Ansible as extra vars, so a variable set there wins over
# inventory/group_vars/all.yml and the roles' defaults. Use it for anything
# you change on your machine; all.yml keeps the shared defaults.
#
# The file must set at least one variable (Ansible rejects an empty one).

# Workload layer: slurm or k3s (Kubernetes). On a built cluster: make down,
# change it, make up (volumes are kept).
scheduler: slurm

# More examples (any variable from inventory/group_vars/all.yml):
# apt_mirror: http://mirrors.edge.kernel.org/ubuntu   # a fixed mirror instead of the fastest (auto)
# fakegpu_coherent_gpu_memory: driver
# cluster_users: [...]
