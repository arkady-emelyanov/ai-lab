# Instances are Incus system containers on this machine; Ansible reaches
# them with `incus exec`, no SSH involved. Instance name = hostname = Slurm
# node name = SSH alias (bin/ssh; the login node is also `login`).
#
# GPU trays live in their own Incus project so each tray's BMC can be given
# power control over the trays only. ip_host is the last octet of each
# instance's static address on the Incus bridge.
all:
  vars:
    ansible_connection: community.general.incus
    ansible_incus_project: default
  children:
    cluster:
      children:
        controller:
          hosts:
            sched-control:
              ip_host: 10
        login:
          hosts:
            sched-login:
              ip_host: 11
        workers:
          vars:
            ansible_incus_project: trays
          hosts:
            sched-worker1:
              tray: 1
              ip_host: 21
            sched-worker2:
              tray: 2
              ip_host: 22
    # Shared storage: RustFS (S3) and Redis, the JuiceFS metadata engine.
    storage:
      hosts:
        sched-storage:
          ip_host: 12
    # NVLink switch tray host: runs the partition controller (fakenmxc).
    nvswitch:
      hosts:
        sched-nvswitch:
          ip_host: 34
    # Redfish BMCs, out of band: one per GPU tray and one for the switch tray.
    bmc:
      children:
        tray_bmc:
          hosts:
            sched-worker1-bmc:
              bmc_tray: sched-worker1
              ip_host: 31
            sched-worker2-bmc:
              bmc_tray: sched-worker2
              ip_host: 32
        nvswitch_bmc:
          hosts:
            sched-nvswitch-bmc:
              ip_host: 33
