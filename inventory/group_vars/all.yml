# Repository root (inventory lives in <root>/inventory).
repo_root: "{{ inventory_dir | dirname }}"

# ---- Incus instances ----------------------------------------------------------
incus_image: images:ubuntu/24.04/cloud
incus_profile: default
incus_bridge: incusbr0
# Ubuntu package mirror for every instance (archive and security pockets).
# auto: the fastest from this machine among apt_mirror_candidates and the
# mirrors Ubuntu suggests for its location (chosen once a day, cached in
# .cache/apt-mirror). Or a fixed URL, e.g. http://mirrors.edge.kernel.org/ubuntu
# or one from https://launchpad.net/ubuntu/+archivemirrors.
apt_mirror: auto
# Well-connected mirrors on every continent, so auto finds a fast one
# anywhere; add one near you in local.yml if none is.
apt_mirror_candidates:
  - http://archive.ubuntu.com/ubuntu
  - http://mirrors.edge.kernel.org/ubuntu
  - http://mirrors.ocf.berkeley.edu/ubuntu
  - http://mirror.math.princeton.edu/pub/ubuntu
  - http://mirrors.mit.edu/ubuntu
  - http://mirror.it.ubc.ca/ubuntu
  - http://ftp.halifax.rwth-aachen.de/ubuntu
  - http://mirror.init7.net/ubuntu
  - http://mirrors.dotsrc.org/ubuntu
  - http://ftp.uni-stuttgart.de/ubuntu
  - http://ftp.jaist.ac.jp/pub/Linux/ubuntu
  - http://mirror.kakao.com/ubuntu
  - http://mirrors.tuna.tsinghua.edu.cn/ubuntu
  - http://mirror.aarnet.edu.au/pub/ubuntu/archive
  - http://ubuntu.c3sl.ufpr.br/ubuntu
  - http://ubuntu.mirror.ac.za/ubuntu
instance_limits:
  controller: { cpu: 2, memory: 2GiB }
  login: { cpu: 2, memory: 4GiB }
  workers: { cpu: 4, memory: 8GiB }
  bmc: { cpu: 1, memory: 256MiB }
  storage: { cpu: 2, memory: 4GiB }
  nvswitch: { cpu: 1, memory: 256MiB }
# ---- Components -------------------------------------------------------------------
# Optional parts of the lab (the controller, the login node, the GPU trays,
# the scheduler and the directory are always there). Switched on a built
# lab: make provision creates or deletes its instances, make configure
# installs or removes it and reconfigures what uses it (make up does both).
# See docs/platform.md#components.
# Redfish BMCs of the GPU trays and of the NVLink switch tray (tray power,
# sensors, NVLink ports; 3 instances).
bmc: true
# NVLink switch tray host: partition controller and fabric telemetry (1
# instance). Without it the GPUs stay in their last NVLink partitions, the
# default one on a new lab, until their next reset puts them back there.
nvswitch: true
# Storage node (RustFS object store, Redis) with JuiceFS at /pfs and
# per-user S3 on every node (1 instance). KubeRay needs it (History Server).
# /shared and /scratch are Incus volumes and stay.
storage: true
# Prometheus, Grafana and the exporters (node, GPU, Slurm, Redfish,
# kube-state-metrics). Run:ai brings its own Prometheus and does not need it.
monitoring: true
# topograph: the scheduler's topology (Slurm topology.conf, Kubernetes node
# labels for Kueue) follows NVLink partitions and the InfiniBand fabric.
# Without it the topology is set once from the settings: one NVLink domain
# under one InfiniBand leaf.
topology: true
# Slurm accounting: slurmdbd and MariaDB on the controller (sacct, sreport,
# accounts and limits). Slurm mode only.
slurm_accounting: true
# The instances these settings give the lab; plays on optional ones run on
# <group>:&enabled (playbooks/enabled.yml).
lab_instances: >-
  {{ groups['cluster']
     + (groups['storage'] if storage | bool else [])
     + (groups['nvswitch'] if nvswitch | bool else [])
     + (groups['tray_bmc'] if bmc | bool else [])
     + (groups['nvswitch_bmc'] if bmc | bool and nvswitch | bool else []) }}

# ---- Scheduler --------------------------------------------------------------------
# Workload layer on the same emulated hardware: slurm or k3s (Kubernetes).
# Changing it on a built cluster: make down && make up (volumes are kept).
scheduler: slurm
# k3s mode: the server (control plane, add-ons) shares the controller with
# LDAP, Prometheus and Grafana, and with KubeRay (its Ray dashboard for
# finished clusters alone takes about 0.5 GiB; at 3 GiB the controller
# thrashes); kubelet and pods need more room on the trays.
instance_limits_k3s:
  controller: { cpu: 2, memory: 5GiB }
  workers: { cpu: 4, memory: 10GiB }
k3s_version: v1.36.5+k3s1
k3s_sha256: d73847bcd3c5fccef0115b372e2f9a91f3032dc84bbf71518a4617565294d313
k3s_port: 6443
# Registry mirrors for containerd: anonymous Docker Hub pulls are rate-limited,
# so docker.io images (the pod image, k3s' own) come from Google's public
# Docker Hub cache, falling back to Docker Hub itself.
k3s_registry_mirrors:
  docker.io: [https://mirror.gcr.io]
# Add-ons, installed by k3s' Helm controller.
nfd_chart_version: 0.19.0
kueue_chart_version: 0.20.0
jobset_chart_version: 0.12.0
ksm_chart_version: 8.6.0
ksm_node_port: 30808
# Ingress controller on the controller's ports 80 and 443: the lab's web UIs
# over plain HTTP (KubeRay), Run:ai over HTTPS with its own certificate.
haproxy_ingress_chart_version: 1.54.2
# NVIDIA GPU Feature Discovery (image of NVIDIA's k8s-device-plugin release).
gfd_image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1
# Image for GPU pods: Ubuntu 24.04 with Python, so the frameworks venv on
# /shared and the fake GPU libraries (built on the trays) run unchanged.
k3s_pod_image: docker.io/library/buildpack-deps:noble
# Kueue: queue `gpu` in every user namespace, plus `default` for workloads
# without a queue label, both feeding one ClusterQueue.
k3s_queue: gpu

# Project for the GPU trays; it shares the default project's profiles,
# networks and storage volumes.
trays_project: trays
# Incus custom volume mounted at /shared on every instance (homes, job
# scripts, venvs) - the cluster's shared filesystem.
shared_pool: default
shared_volume: cluster-shared
shared_mount: /shared
# Node-local "NVMe" scratch on each worker (dataset loaders, Ray spilling,
# caches): one quota-limited volume per worker in a btrfs pool backed by a
# sparse loop file, so only data actually written uses host disk.
scratch_pool: local-nvme
scratch_pool_driver: btrfs
scratch_pool_size: 200GiB
scratch_size_gib: 50
scratch_mount: /scratch

# ---- KubeRay (scheduler: k3s) ------------------------------------------------------
# Ray on Kubernetes: the KubeRay operator (RayCluster, RayJob, RayService),
# its API server and its web dashboard, on the controller; Ray's pods run on
# the trays, admitted by Kueue (in Run:ai project namespaces, with runai:
# true, scheduled by KAI). See docs/kuberay.md.
kuberay: true
kuberay_version: 1.7.1
kuberay_chart_repo: https://kuberay-project.github.io/kuberay-helm/
# Name of the dashboard (plain HTTP). auto: kuberay.<controller address>.nip.io.
kuberay_domain: auto
# History Server (beta upstream): the collector sidecar in a Ray cluster's
# pods uploads its logs and events to this RustFS bucket, with an S3 user of
# its own (keys in .secrets/ray-history.s3); the dashboard's History pages
# show them after the cluster is gone.
kuberay_history_bucket: ray-history
# Ray's own dashboard for finished clusters, backed by the History Server
# (a finished job's Logs link lands there). auto: ray-history.<controller
# address>.nip.io. The image's Ray is the venv's (ray_version, make
# frameworks).
kuberay_history_domain: auto
kuberay_history_ray_image: docker.io/rayproject/ray:{{ ray_version }}-py312-cpu
kuberay_history_secret_key: "{{ lookup('ansible.builtin.password', repo_root ~ '/.secrets/ray-history.s3 length=32 chars=ascii_letters,digits') }}"

# ---- NVIDIA DRA driver: ComputeDomains (scheduler: k3s) --------------------------
# NVIDIA's DRA driver for GPUs, unchanged, with its ComputeDomains only: IMEX
# channels and daemons for memory shared over NVLink between trays, as on
# GB200. GPUs stay with the lab's device plugin, NVIDIA's documented setup
# next to a device plugin. It runs on the fake driver through a driver root
# on the trays (fakegpu_driver_root). See docs/compute-domains.md.
nvidia_dra: true
nvidia_dra_version: 0.5.1
nvidia_dra_chart: oci://registry.k8s.io/dra-driver-nvidia/charts/dra-driver-nvidia-gpu

# ---- NVIDIA Run:ai (scheduler: k3s) ------------------------------------------------
# Open-source NVIDIA Run:ai on the k3s cluster: its control plane (web UI, API,
# Keycloak, PostgreSQL) and its cluster services (KAI Scheduler, operators),
# connected to each other as one Run:ai cluster. Both run on the controller,
# which then needs more room (applied by make provision). With the NVIDIA
# GPU stack's DCGM exporter on the trays and the Prometheus operator, which
# Run:ai requires; it serves its UI through the k3s ingress controller.
runai: false
runai_version: 3.0.20
runai_chart_repo: https://helm.ngc.nvidia.com/nvidia/runai-oss
# Name of the web UI and API. auto: runai.<controller address>.nip.io, a
# public wildcard DNS name that resolves to the address in it, so neither the
# host nor the lab needs a hosts entry (workloads get subdomains of it).
runai_domain: auto
# Administrator of the control plane (password in .secrets/runai-admin.pass).
runai_admin_email: admin@ai-lab.local
runai_cluster_name: nvl8
instance_limits_runai:
  controller: { cpu: 6, memory: 16GiB }
kube_prometheus_stack_chart_version: 92.3.1
# NVIDIA's GPU metrics exporter, unchanged, on the fake NVML.
dcgm_exporter_image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
# NVIDIA's GPU fractioning (GPU fractions), newer than Run:ai's 0.1.6: 0.1.7
# is the first that gets GPUs through the GPU Operator's NRI plugin.
gpu_fractioning_version: v0.1.7

# ---- Slurm --------------------------------------------------------------------
slurm_cluster_name: nvl8
slurm_partition: gpu
# Accounting: slurmdbd + MariaDB on the controller. Every user needs an
# association (account) to run jobs.
slurm_accounts:
  - name: lab
    description: AI lab
    organization: example.com
  - name: research
    description: Research projects
    organization: example.com
slurmdbd_db: slurm_acct_db
# Must stay below the instance memory limit (MiB).
slurm_node_memory_mb: 7500
# REST API (slurmrestd on the controller) with JWT authentication: users get
# a token with `scontrol token`; slurmctld and slurmdbd also accept JWT. The
# key is .secrets/slurm-jwt.key.
slurmrestd_port: 6820
slurm_jwt_key: /etc/slurm/jwt_hs256.key
# Lifetime of the SlurmUser token make configure writes to .secrets/slurm-jwt
# for clients on the host (it acts for any user). Rotate it: delete the file
# and make configure; invalidate every token: delete .secrets/slurm-jwt.key
# too.
slurm_service_token_days: 365
# Container runtimes on the login node and the trays (Slurm mode): Pyxis
# with enroot (srun --container-image), Apptainer, Slurm's own OCI support
# (srun --container with an OCI bundle, run by crun) and scrun, Slurm's OCI
# runtime for podman on the login node. GPUs reach containers through the
# fake driver's nvidia-container-cli and nvidia-container-runtime, as NVIDIA's
# container toolkit brings the real driver. See docs/slurm.md#containers.
enroot_version: 4.2.1
enroot_sha256: 5955c51e88df0c5ed538d87abb5264609d4bad55fa8570745ed5d4ec66c8ab91
enroot_caps_sha256: ca22652dcbdd3ebb6e2c68df781ef4301647c79dd7a41ed62899c2fd0f692750
pyxis_version: 0.24.0
pyxis_sha256: 9c4cdb79a67301d8ea05951aa4d2c205f40cf6145e338214b0191add8b36d6c4
apptainer_version: 1.5.5
apptainer_sha256: 25095d3711504b3e8657dbb2e172ef8db9db43c4503d940c9c36b105db8dce77
# Container registry for images from Docker Hub: Google's public Docker Hub
# cache (anonymous Docker Hub pulls are rate-limited), as for k3s.
container_registry: mirror.gcr.io
# Image for the tests and the examples: a plain one; the fake driver's
# nvidia-smi needs nothing from it but glibc 2.34 or later.
container_test_image: library/ubuntu:24.04
# Per-job directories the Slurm epilog removes on every node of a job, for
# what a job's launcher keeps there (e.g. secrets in memory) when the job is
# killed: %j job id, %u the job user's uid.
slurm_epilog_cleanup: [/dev/shm/chassis-%j, /run/user/%u/chassis-%j]
# GPU handover after every job (Slurm Epilog): reset the job's GPUs, which
# clears their memory and state and applies a pending NVLink partition change,
# then drain the node if a GPU is still busy or needs recovery.
gpu_handover_reset: true

# ---- Users (LDAP + SSSD) -------------------------------------------------------
# Users live only in OpenLDAP on the controller; every node resolves them via
# SSSD. Each gets a private group (gid = uid), a home on /shared and a Slurm
# association with `account`. Passwords are (re)applied on every configure run. SSH (root and users) uses the key in .secrets/ssh.
ldap_domain: example.com
ldap_base: dc=example,dc=com
ldap_server: "{{ groups['controller'][0] }}"
ldap_admin_dn: cn=admin,{{ ldap_base }}
ldap_admin_password: "{{ lookup('file', repo_root ~ '/.secrets/ldap-admin.pass') }}"
# Every user also gets an S3 identity on RustFS (access key = user name,
# secret in .secrets/users/<name>.s3) limited to a bucket named after them;
# credentials are written to ~/.aws in their home.
cluster_users:
  - name: joe
    uid: 2001
    comment: Joe <joe@example.com>
    account: lab
    password: joe
  - name: alice
    uid: 2002
    comment: Alice <alice@example.com>
    account: research
    password: alice
# A group of every directory user (LDAP; also the Kubernetes group of their
# certificates), owning the shared directories below.
cluster_users_group: lab-users
cluster_users_gid: 3000
# Directories on /shared every directory user can write and share (group
# cluster_users_group, setgid, a default ACL: what one user creates the
# others can change), e.g. for a job scheduler's environments and caches.
shared_group_dirs: [chassis]
ssh_key_dir: "{{ repo_root }}/.secrets/ssh"

# Preinstalled on the login node.
login_packages:
  - build-essential
  - git
  - vim
  - nano
  - tmux
  - htop
  - tree
  - rsync
  - curl
  - wget
  - unzip
  - less
  - man-db
  - python3-pip
  - python3-venv
  - python3-dev

# ---- Emulated GPUs: one NVL8 domain = 2 trays x 4 GPUs --------------------------
fakegpu_count: 4
fakegpu_type: gb200
fakegpu_name: NVIDIA GB200
fakegpu_mem_mb: 189471
fakegpu_nvlinks: 18
# GPU profile (defaults: GB200). Read by the fake driver (nvidia-smi, NVML,
# GPU Feature Discovery's labels, the timing model), the tray BMCs (sensors,
# power limit, port speeds) and the partition controller (links per GPU).
# NVLink bandwidth is per link and direction (18 x 50 GB/s = 900 GB/s per
# GPU); power draw goes from idle to max_power at full utilisation;
# throughput figures are dense FLOP/s and copy rates.
fakegpu_nvlink_link_gbs: 50
fakegpu_power_limit_w: 1200
fakegpu_idle_power_w: 140
fakegpu_max_power_w: 1000
fakegpu_sm_count: 148
fakegpu_tensor_tflops: 2500
fakegpu_tf32_tflops: 1250
fakegpu_fp8_tflops: 5000
fakegpu_fp32_tflops: 60
fakegpu_fp64_tflops: 40
fakegpu_host_link_gbs: 400
fakegpu_hbm_gbs: 4000
# GPU memory as NUMA nodes, like the driver option NVreg_CoherentGPUMemoryMode:
# os (the driver's default) onlines each GPU's coherent memory as a NUMA node
# (GB200: GPUs on nodes 2, 10, 18, 26, next to the Grace CPUs' 0 and 1), so
# nvidia-smi topo -m shows a GPU NUMA ID; driver (CDMM, which NVIDIA
# recommends for Kubernetes) keeps it out of the OS: GPU NUMA ID N/A.
fakegpu_coherent_gpu_memory: os
# Versions the emulated driver reports: nvidia-smi ("Driver Version", "CUDA
# Version", "VBIOS Version"), NVML, cuDriverGetVersion, GPU Feature Discovery's
# nvidia.com/cuda.driver-version.* and cuda.runtime-version.* labels, and the
# tray BMCs' firmware inventory (VBIOS). cuda_version is the highest CUDA
# version the driver supports, MAJOR.MINOR. With Run:ai, an r615 driver
# (CUDA 13.4): NVIDIA's GPU fractioning needs it.
fakegpu_driver_version: "{{ '615.20.01' if runai | bool else '580.95.05' }}"
fakegpu_cuda_version: "{{ '13.4' if runai | bool else '13.0' }}"
fakegpu_vbios_version: "97.00.82.00.0F"
# BMC firmware in the BMCs' Redfish FirmwareInventory and managers: the host
# BMC (FW_BMC_0, BMC_0), the HGX Management Controller (HGX_FW_BMC_0,
# HGX_BMC_0), the switch tray's NVSwitch and CPLD firmware. VBIOS and BMC
# firmware can be set per tray in inventory/hosts.yml (under the tray, e.g.
# sched-worker2) to make one tray drift from the others.
bmc_firmware_version: fakebmc-1.0.0
hmc_firmware_version: fakebmc-hmc-1.0.0
nvswitch_firmware_version: fakebmc-nvswitch-1
nvswitch_cpld_firmware_version: fakebmc-cpld-1
# DMI product name of a tray, as GPU Feature Discovery reports it
# (nvidia.com/gpu.machine); a container would otherwise show the host's board.
tray_product_name: GB200 NVL
# Shared by every tray of the NVLink domain; NVML reports it as the fabric
# cluster UUID, which is how schedulers recognise one NVL domain.
nvl_domain_name: nvl8
nvl_cluster_uuid: 7f3c2a10-5b4e-4d6a-9c1e-2b8f0e6d4a91
nvl_clique_id: 1
fakegpu_prefix: /usr/local
# The fake driver laid out as NVIDIA's driver is on a host, for NVIDIA's DRA
# driver (k3s, nvidia_dra): its libraries under their versioned names,
# nvidia-smi, nvidia-imex and nvidia-imex-ctl, and the /proc entries the DRA
# driver reads (devices, the IMEX management capability). Not / itself: the
# lab's host may have a real driver whose /proc shows through.
fakegpu_driver_root: /opt/fakegpu/driver
# Device numbers of the IMEX device nodes on the trays (Incus creates them):
# /dev/nvidia-caps/nvidia-cap<fakegpu_imex_mgmt_minor> (IMEX management) and
# /dev/nvidia-caps-imex-channels/channel<n>, as the real driver's are.
fakegpu_caps_major: 235
fakegpu_imex_channels_major: 236
fakegpu_imex_mgmt_minor: 1
# Simulated operation times (kernels, copies, GEMMs, collectives): 1.0 is
# roughly GB200 speed, 0 disables delays. Copies above copy_max_mb only cost
# time, so big device buffers never use host RAM.
fakegpu_latency_scale: 1.0
fakegpu_copy_max_mb: 64
# Shared between a tray and its BMC (the emulated I2C/MCTP sideband).
sideband_tray_path: /var/lib/fakegpu/sideband
sideband_bmc_path: /var/lib/fakebmc/sideband
# Each tray's GPU occupancy file lives on a volume its BMC (GPU sensors) and
# the switch tray host (NVLink traffic and utilisation) read.
telemetry_tray_path: /var/lib/fakegpu/telemetry
telemetry_bmc_path: /var/lib/fakebmc/telemetry
# Fake NCCL: ranks exchange their NVLink partitions here at communicator init
# (on the shared volume, reachable from every job and pod); collectives
# between partitions cross InfiniBand at this rate per GPU (one NIC each).
fakegpu_nccl_dir: "{{ shared_mount }}/.fakegpu/nccl"
# GPU memory shared as fabric handles (MNNVL: cuMemCreate with
# CU_MEM_HANDLE_TYPE_FABRIC, multicast objects) lives here, where every tray of
# the NVLink domain reaches it; empty: no fabric handles.
fakegpu_fabric_dir: "{{ shared_mount }}/.fakegpu/fabric"
# GPU memory shared through CUDA IPC (cudaIpcGetMemHandle) lives here, on
# each tray, mounted into every GPU pod: any process on the tray opens a
# handle, as on real GPUs (same node, any container).
fakegpu_ipc_dir: /var/lib/fakegpu/ipc
ib_gbps_per_gpu: "{{ ib_link_gbps[ib_link_rate] }}"

# NVLink switch tray: switch chips and ports per chip (8 GPUs x 18 links fill
# 2 x 72 ports), and the partition controller's gRPC port.
nvswitch_count: 2
nvswitch_ports: 72
nmxc_port: 9370
nmxc_metrics_port: 9372

# Emulated InfiniBand compute fabric (fake ibnetdiscover on the trays) and
# topograph on the controller generating topology.conf from it.
ib_spine: LAB-IBSPINE-01
ib_leaf: LAB-IBLEAF-01
ib_hcas_per_node: 4
# InfiniBand link rate of the HCAs (4x links): what ibnetdiscover reports and
# the per-GPU bandwidth NCCL gets between NVLink partitions.
ib_link_rate: NDR
ib_link_gbps: { SDR: 10, DDR: 20, QDR: 40, FDR: 56, EDR: 100, HDR: 200, NDR: 400, XDR: 800 }
topograph_port: 49021
# Commit of dsx-ai-factory/topograph built by `make init`.
topograph_ref: 258d446

# ---- BMC (Redfish) ---------------------------------------------------------------
bmc_username: root
bmc_password: 0penBmc
# Incus API on the bridge address, used by the BMCs for tray power control
# with client certificates restricted to the trays project.
incus_api_port: 8443

# ---- Monitoring ----------------------------------------------------------------------
gpu_exporter_version: 1.15.1
gpu_exporter_port: 9835
slurm_exporter_version: 1.8.0
slurm_exporter_port: 9092
# Out-of-band: Redfish exporter on the controller, polling the BMCs.
redfish_exporter_version: 2.6.3
redfish_exporter_sha256: 4e52e7101894646995d30219cceae22f2faaaeb1bde932306495a3d29081f054
redfish_exporter_port: 9348
prometheus_retention: 15d
grafana_port: 3000
grafana_admin_password: "{{ lookup('file', repo_root ~ '/.secrets/grafana.pass') }}"
# Published dashboards (grafana.com id: pinned revision).
grafana_dashboards:
  - { id: 14574, revision: 15, file: nvidia-gpu-metrics.json } # nvidia_gpu_exporter's own
  - { id: 1860, revision: 45, file: node-exporter-full.json }

# ---- Frameworks (make frameworks) -------------------------------------------------------
frameworks_venv: /shared/venv
torch_index: https://download.pytorch.org/whl/cu130
# Ray in the venv, and in the image of Ray's dashboard for finished clusters
# (KubeRay): the same version, so it reads what the venv's Ray wrote.
ray_version: 2.59.0
frameworks_packages:
  - torch
  - "ray[default]=={{ ray_version }}"
  - numpy
  - boto3

# ---- Clients on the host ----------------------------------------------------------
# Services running on the Incus host that use the lab (a job scheduler such as
# Chassis). They reach the host at the bridge's address from the instances.
# uv on the login node and the trays, for Python environments jobs create.
uv_version: 0.13.5
uv_sha256: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
# S3 users of their own on RustFS (with storage: true), each with one bucket
# of the same name and nothing else; access key the name, secret key in
# .secrets/<name>.s3.
s3_service_users: [chassis]
# Kubernetes service accounts (k3s mode): namespace and ServiceAccount
# <name>, allowed to act as the directory users (impersonation) and to read
# nodes, runtime, priority and storage classes, CRDs, Kueue's objects and
# Deployments; kubeconfig in .secrets/<name>-kubeconfig.
k3s_client_accounts: [chassis]

# ---- Storage: RustFS (S3) + JuiceFS ----------------------------------------------------
storage_host: "{{ groups['storage'][0] }}"
rustfs_version: 1.0.1
rustfs_port: 9000
rustfs_console_port: 9001
# Incus volume holding the object data on the storage node.
rustfs_volume: rustfs-data
rustfs_access_key: "{{ lookup('file', repo_root ~ '/.secrets/rustfs.access') }}"
rustfs_secret_key: "{{ lookup('file', repo_root ~ '/.secrets/rustfs.secret') }}"
redis_password: "{{ lookup('file', repo_root ~ '/.secrets/redis.pass') }}"
# RustFS client (rc): admin on the storage node, user CLI on Slurm nodes.
rc_version: 0.1.36
rc_base: https://github.com/rustfs/cli/releases/download/v{{ rc_version }}
rc_tarball: rustfs-cli-linux-amd64-gnu-v{{ rc_version }}.tar.gz
s3_endpoint: http://{{ storage_host }}:{{ rustfs_port }}
juicefs_version: 1.4.1
juicefs_name: pfs
juicefs_bucket: pfs
juicefs_mount: /pfs
juicefs_meta_url: redis://{{ storage_host }}:6379/1
# Incus volume holding Redis' data (the filesystem's metadata) on the storage
# node, so make down / make up keep /pfs like the object data it describes.
juicefs_meta_volume: juicefs-meta
# Local read cache: node-local scratch on the trays, the root disk elsewhere.
juicefs_cache_dir: "{{ scratch_mount ~ '/juicefs-cache' if inventory_hostname in groups['workers'] else '/var/cache/juicefs' }}"
juicefs_cache_mib: 10240
